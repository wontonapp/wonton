[package]
name = "wonton-echo-bot"
description = "回声 Bot：最小的 Matrix Bot 示例插件（plugins/examples/echo-bot），也是冒烟测试的加密收发探针"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "echo-bot"
path = "src/main.rs"

# 依赖许可证均为 MIT 或 Apache-2.0。
[dependencies]
anyhow = { workspace = true }
# Apache-2.0。默认特性含 E2EE 和 SQLite 存储；bundled-sqlite 自带 SQLite，镜像里不装系统库。
matrix-sdk = { workspace = true, features = ["bundled-sqlite"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[lints]
workspace = true
