[package]
name = "wonton-tunnel"
description = "iroh 隧道：服务端入口与客户端本地 HTTP 代理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# MIT OR Apache-2.0。解析本地代理收到的 Proxy-Authorization（Basic）。
base64 = { workspace = true }
# MIT OR Apache-2.0。生成本地代理的会话凭据。
getrandom = { workspace = true }
# MIT OR Apache-2.0。解析本地代理收到的第一个请求头（hyper 用的同一个解析器）。
httparse = "1.10.1"
iroh = { workspace = true }
# MIT OR Apache-2.0。配对请求和回应的 JSON。
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing = { workspace = true }
# MIT OR Apache-2.0。二维码里的配对码是一个 wonton:// 地址。
url = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
# 示例的命令行解析。MIT OR Apache-2.0。
clap = { version = "4.6.7", features = ["derive"] }
tokio = { workspace = true, features = ["signal"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
