[package]
name = "wonton-core"
description = "服务端核心：插件管理、网关与配对、推送代理、MCP 总线"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 依赖许可证均为 MIT 或 Apache-2.0（bollard 为 Apache-2.0）。
[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
# 安装记录里以 base64 保存插件包里的文件。
base64 = { workspace = true }
bollard = { workspace = true }
futures-util = "0.3.34"
getrandom = { workspace = true }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
iroh = { workspace = true }
serde = { workspace = true }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = { workspace = true }
shlex = "2.0.1"
# 经 Docker 的归档接口往容器里写 configs、读插件写下的密钥。
tar = { version = "0.4.46", default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "time", "signal", "sync", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url = "2.5.8"
wonton-tunnel = { path = "../wonton-tunnel" }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
