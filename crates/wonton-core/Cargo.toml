[package]
name = "wonton-core"
description = "服务端核心：插件管理、网关与配对、推送代理、MCP 总线"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 依赖许可证均为 MIT 或 Apache-2.0（bollard 为 Apache-2.0），另注明的除外。
[dependencies]
anyhow = { workspace = true }
# ISC AND (Apache-2.0 OR ISC)。注册 Tuwunel 管理账号要 HMAC-SHA1；rustls 和 jsonwebtoken 已经依赖它。
aws-lc-rs = { workspace = true }
axum = { workspace = true }
# 安装记录里以 base64 保存插件包里的文件。
base64 = { workspace = true }
bollard = { workspace = true }
futures-util = "0.3.34"
getrandom = { workspace = true }
# MIT OR Apache-2.0。状态页和终端上的配对二维码。
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
# MIT OR Apache-2.0。插件的图标和截图（ADR-0017，只收 PNG 和 JPEG）、文件的缩略图（ADR-0020，另收 GIF 和 WebP）解码、
# 缩放后重新编码。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# 算插件网络里留给核心的地址和出口容器的名单。
ipnet = { version = "2.12.2", features = ["serde"] }
iroh = { workspace = true, features = ["unstable-net-report"] }
# MIT。签发 Tuwunel 登录用的 JWT（EdDSA）。
jsonwebtoken = { workspace = true }
# Apache-2.0 OR MIT。挑插件文字的语言（ADR-0017、ADR-0043）：协商语言，cldr 特性带 CLDR 的可能子标签（zh-TW → zh-Hant）。
fluent-langneg = { version = "0.14.2", features = ["cldr"] }
# Unicode-3.0。fluent-langneg 不导出补全语言标签的 LocaleExpander，请求的语言要先补全再协商。
icu_locid_transform = "1.5"
# MIT OR Apache-2.0。解码共享文件夹引用的路径，编码下载的文件名。
percent-encoding = "2.3.2"
# MIT OR Apache-2.0。推送代理按 Web Push 发推送：推送地址来自设备，可能是 https（rustls，根证书用系统的）。
reqwest = { workspace = true, features = ["rustls", "socks"] }
semver = "1.0.28"
# Apache-2.0 OR MIT（渲染用的 tiny-skia 是 BSD-3-Clause，解析 XML 的 roxmltree 是 MIT OR Apache-2.0，经 resvg 引用）。
# SVG 图标渲染成 PNG；不开 text、raster-images、svgz：不渲染文字，不解码 SVG 里嵌的位图，不收压缩过的 SVG。
resvg = { version = "0.49.0", default-features = false }
# Apache-2.0。MCP 总线（ADR-0006、ADR-0016）：对 Agent 是 Streamable HTTP 服务器，对插件是客户端。
rmcp = { version = "3.8.0", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
# Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT。处理图片的子进程给自己设资源上限（setrlimit）；逐级 openat 打开共享文件夹
# 里的文件。都不用写 unsafe。
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std"] }
# 存文件的审计里记内容的哈希（MIT OR Apache-2.0）。
sha2 = "0.10"
# MIT OR Apache-2.0。rmcp 已经在用：MCP 响应要边读边限制大小，SSE 由总线自己解析（mcp::bounded_http）。
sse-stream = "0.2.6"
# 校验 TZ 是 IANA 时区名（Unlicense OR MIT）：核心镜像里不一定有 /usr/share/zoneinfo。
jiff-tzdb = "0.1"
serde = { workspace = true }
# MIT OR Apache-2.0。读 compose，写出口容器 gost 的配置（ADR-0023）。
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize", "serialize"] }
# MIT OR Apache-2.0。插件清单和服务反序列化失败时，报错带上字段路径。
serde_path_to_error = "0.1.20"
serde_json = { workspace = true }
shlex = "2.0.1"
# Apache-2.0 OR MIT。检查 SVG 图标的样式表：和 usvg 用同一个解析器（Cargo.lock 里只有一份）。
simplecss = "0.2.2"
# Apache-2.0。按 SPDX 许可证列表校验清单的 `license`。
spdx = "0.13.6"
# 经 Docker 的归档接口往容器里写 configs、读插件写下的密钥。
tar = { version = "0.4.46", default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "time", "signal", "sync", "io-util", "process"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
# MIT OR Apache-2.0。按 Unicode 类别过滤文件名里看不见的字符。
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
url = { workspace = true }
# MIT OR Apache-2.0。推送内容按 RFC 8291 加密给设备（RustCrypto 的 P-256、HKDF、AES-GCM）；不用 VAPID。
web-push-native = { version = "0.5.0", default-features = false }
wonton-protocol = { path = "../wonton-protocol" }
wonton-tunnel = { path = "../wonton-tunnel" }
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1.10"

# MIT。检测局域网地址（ADR-0019）：经 netlink 列出宿主的地址。
[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.33.0"
netlink-sys = { version = "0.9.0", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
