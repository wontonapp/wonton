[package]
name = "wonton-onboard"
description = "omp 收尾工具：verify 批次、owner/recover、close-guard 与自动恢复"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "onboard"
path = "src/main.rs"

# 依赖许可证均为 MIT 或 Apache-2.0。
[dependencies]
anyhow = { workspace = true }
# MIT OR Apache-2.0。CLI。
clap = { version = "4.6.7", features = ["derive"] }
# MIT OR Apache-2.0。state 文件的文件锁。
fs2 = "0.4.3"
serde = { workspace = true }
serde_json = { workspace = true }
# MIT OR Apache-2.0。状态的 TOML 序列化。
toml = "1.1"
# Apache-2.0 OR MIT。cycle 号。
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
