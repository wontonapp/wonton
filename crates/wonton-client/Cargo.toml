[package]
name = "wonton-client"
description = "客户端厚核心：状态、业务逻辑、网络与 ViewModel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# staticlib 给 iOS，cdylib 给 Android 和绑定生成，lib 给测试。
crate-type = ["lib", "staticlib", "cdylib"]

# 生成 Kotlin 绑定（以及通用的 UniFFI 命令行）。
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

# 生成 Swift 绑定、头文件和 XCFramework 用的 modulemap。
[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[features]
# 只在生成 Swift / Kotlin 绑定时启用，避免把 CLI 依赖带进 App。
bindgen = ["uniffi/cli"]

[dependencies]
# MIT OR Apache-2.0。
futures-util = "0.3.34"
iroh = { workspace = true }
# MIT OR Apache-2.0。经本地代理向核心要 Matrix 登录令牌；matrix-sdk 已经用它，不带额外特性。
reqwest = { version = "0.13.5", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uniffi = { workspace = true }
url = { workspace = true }
wonton-matrix = { path = "../wonton-matrix" }
wonton-protocol = { path = "../wonton-protocol", features = ["uniffi"] }
wonton-tunnel = { path = "../wonton-tunnel" }

# libc 0.2.190 起只在 macOS 上提供 `in6_ifreq`，而 iroh 依赖的 netdev 0.46 在 iOS 上也用它，iOS 编译失败。
# 上游修好之前固定在 0.2.189（MIT OR Apache-2.0）。lockfile 不分目标，整个工作区都用这个版本。
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
base64 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "net", "io-util"] }
# 聊天的集成测试：一次性的 Tuwunel 和模拟核心的 JWT 签发。
wonton-matrix = { path = "../wonton-matrix", features = ["testkit"] }

[lints]
workspace = true
