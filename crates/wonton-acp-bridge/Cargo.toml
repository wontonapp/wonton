[package]
name = "wonton-acp-bridge"
description = "Matrix 与 ACP Agent 之间的 Wonton 桥"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wonton-acp-bridge"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 图片内容块的 base64（ACP image 块）。
base64 = { workspace = true }
sha2 = { workspace = true }
futures-util = "0.3.34"
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "io-std", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url = { workspace = true }
# MCP 总线是 Streamable HTTP，客户端的握手交给官方 SDK。
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
# 出箱 Message 项挑已加入的私聊房间、带事务 ID 发送：这两个口子在 SDK 的 Room 上，wonton-matrix
# 的封装没有包。版本随 workspace。
matrix-sdk = { workspace = true }
wonton-l10n = { path = "../wonton-l10n" }
wonton-matrix = { path = "../wonton-matrix" }
wonton-protocol = { path = "../wonton-protocol" }

[dev-dependencies]
# 官方 ACP SDK（Apache-2.0）：换官方库（ADR-0061 第 11 节）之前的报文契约对照物，不进二进制。
# 钉 0.13 是因为 1.0 起的 preserve_order 会让 wonton-core 的 clippy 失败，换的时候一起处理。
agent-client-protocol = { version = "=0.13.1", features = ["unstable_auth_methods", "unstable_message_id"] }
# SDK 0.13.1 没把 unstable_elicitation 转发出来，直接给钉死的 schema crate 开这个特性。
agent-client-protocol-schema = { version = "=0.13.5", features = ["unstable_elicitation"] }
axum = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
tempfile = { workspace = true }
tracing-core = { workspace = true }
# 停机重启的集成测试要真 Tuwunel；只进测试构建。
wonton-matrix = { path = "../wonton-matrix", features = ["testkit"] }
# MIT OR Apache-2.0。镜像冒烟的基础镜像在 CI 指到镜像仓库副本。
wonton-test-images = { path = "../wonton-test-images" }

[lints]
workspace = true
