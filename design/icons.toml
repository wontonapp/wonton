# 每个语义名两套上游：iOS 用 kubai（彩色分层，color 取 [palette] 里的名字；单色版由同一张图生成），
# Android 用 phosphor。没写 kubai 的语义名 iOS 没有（checks 上游没有对应图形，iOS 也没用到）。
# bare 表示只留图形本体、去掉上游自带的圆底（箭头和加号会放进圆钮或成排出现）。
# fill 表示 Phosphor 还要实心版（选中时用），Kubai 不分线框和实心；mirror 表示从右到左时要翻转。
[upstream.phosphor]
package = "@phosphor-icons/core"
version = "2.1.1"
license = "MIT"

# Kubai 是 0.x，图形会变：版本和 tarball 的校验值钉死，用到的 SVG 原件放在 kubai/svg/。
# 升级或加图标时运行 python3 scripts/generate-design.py --vendor-kubai <tarball>。
[upstream.kubai]
package = "kubai-icons-static"
version = "0.15.0"
license = "MIT"
integrity = "sha512-Nkgn0vaPujk/IjehYPyubgA18OQbgLN/ECCnk06LUgyeIbpMjOfM/BRHEi40XMD72nngeQEtV22aYKY/GrifTw=="
# 包里 svg/ 的主色。换色时按它反推每个颜色是怎么从主色调出来的。
base = "#5393FF"

# 图标的主色，浅色和深色页面各一个：浅色页面上取深一档，不然浅面在白底上发灰；深色页面上取亮一档。
# 各自对那一边的页面底和卡片底都要有 3:1（生成时检查）。
[palette]
blue = { light = "#0D66F3", dark = "#2D7AF5" }
green = { light = "#158046", dark = "#189150" }
orange = { light = "#B55215", dark = "#CD5D18" }
red = { light = "#DA1F25", dark = "#E44348" }
purple = { light = "#7452EF", dark = "#8567F1" }
pink = { light = "#CD2D6D", dark = "#D74A83" }
teal = { light = "#0B7D73", dark = "#0D8E82" }
amber = { light = "#9B6308", dark = "#B07109" }
indigo = { light = "#4D62E7", dark = "#6274EA" }
sky = { light = "#1076AD", dark = "#1385C4" }
slate = { light = "#536074", dark = "#6F8098" }

[icons]
add = { bare = true, kubai = "circle-plus", color = "blue", phosphor = "plus" }
agent = { kubai = "sparkles", color = "purple", phosphor = "sparkle", fill = true }
apps = { kubai = "grid", color = "indigo", phosphor = "squares-four", fill = true }
attach = { kubai = "paperclip", color = "slate", phosphor = "paperclip" }
back = { bare = true, kubai = "chevron-left", color = "slate", phosphor = "caret-left", mirror = true }
blocked = { kubai = "ban", color = "red", phosphor = "prohibit" }
cameraOff = { kubai = "camera-off", color = "slate", phosphor = "camera-slash" }
chat = { kubai = "messages", color = "blue", phosphor = "chats-circle", fill = true }
check = { kubai = "circle-check", color = "green", phosphor = "check" }
checkCircle = { kubai = "circle-check", color = "green", phosphor = "check-circle", fill = true }
checks = { phosphor = "checks" }
clock = { kubai = "clock", color = "sky", phosphor = "clock" }
close = { kubai = "circle-x", color = "slate", phosphor = "x" }
code = { kubai = "code", color = "indigo", phosphor = "code", fill = true }
compose = { kubai = "notebook-pen", color = "orange", phosphor = "note-pencil" }
connection = { kubai = "radio-tower", color = "teal", phosphor = "broadcast" }
copy = { kubai = "copy", color = "sky", phosphor = "copy" }
cpu = { kubai = "cpu", color = "indigo", phosphor = "cpu", fill = true }
device = { kubai = "smartphone", color = "slate", phosphor = "device-mobile-camera" }
