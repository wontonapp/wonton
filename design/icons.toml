# 语义名到 Kubai 图形的白名单，iOS 和 Android 共用。kubai 是上游的图形名，color 取 [palette] 里的名字；
# 彩色分层和单色两版都由同一张上游图生成。
# bare 表示只留图形本体、去掉上游自带的圆底（箭头和加号会放进圆钮或成排出现）。
# fill 表示再给一个带 Fill 的别名（界面按选中态取名；Kubai 不分线框和实心，两个名字是同一张图）。
# mirror 表示从右到左时要翻转。
# Kubai 是 0.x，图形会变：版本和 tarball 的校验值钉死，用到的 SVG 原件放在 kubai/svg/（怎么重取见 README）。
[upstream.kubai]
package = "kubai-icons-static"
version = "0.15.0"
license = "MIT"
integrity = "sha512-Nkgn0vaPujk/IjehYPyubgA18OQbgLN/ECCnk06LUgyeIbpMjOfM/BRHEi40XMD72nngeQEtV22aYKY/GrifTw=="
# 包里 svg/ 的主色。换色时按它反推每个颜色是怎么从主色调出来的。
base = "#5393FF"

# 图标的主色，浅色和深色页面各一个：浅色页面上取深一档，不然浅面在白底上发灰；深色页面上取亮一档。
# 各自对那一边的页面底、卡片底和强调填充（选中、主按钮、自己的气泡、插件占位图的底）都要有 3:1，生成时检查。
[palette]
blue = { light = "#0D66F3", dark = "#5794F7" }
green = { light = "#158046", dark = "#1CAB5E" }
orange = { light = "#B55215", dark = "#E7752F" }
red = { light = "#DA1F25", dark = "#EA6E72" }
purple = { light = "#7452EF", dark = "#9C84F4" }
pink = { light = "#CD2D6D", dark = "#E0719D" }
teal = { light = "#0B7D73", dark = "#0FA799" }
amber = { light = "#9B6308", dark = "#D0840A" }
indigo = { light = "#4D62E7", dark = "#7F8EEE" }
sky = { light = "#1076AD", dark = "#169DE6" }
slate = { light = "#58667B", dark = "#8896AA" }

[icons]
add = { bare = true, kubai = "circle-plus", color = "blue" }
agent = { kubai = "sparkles", color = "purple", fill = true }
apps = { kubai = "grid", color = "indigo", fill = true }
attach = { kubai = "paperclip", color = "slate" }
back = { bare = true, kubai = "chevron-left", color = "slate", mirror = true }
blocked = { kubai = "ban", color = "red" }
cameraOff = { kubai = "camera-off", color = "slate" }
chat = { kubai = "messages", color = "blue", fill = true }
check = { kubai = "circle-check", color = "green" }
checkCircle = { kubai = "circle-check", color = "green", fill = true }
checks = { kubai = "eye", color = "sky" }
