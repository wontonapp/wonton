eye = { kubai = "eye", color = "sky", phosphor = "eye" }
file = { kubai = "file", color = "slate", phosphor = "file" }
folder = { kubai = "folder", color = "amber", phosphor = "folder", fill = true }
forward = { bare = true, kubai = "chevron-right", color = "slate", phosphor = "caret-right", mirror = true }
globe = { kubai = "globe", color = "teal", phosphor = "globe", fill = true }
