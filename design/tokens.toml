# ADR-0026 的固定令牌。颜色不在这里：浅色、深色两套颜色由客户端核心给（ADR-0130）。

[spacing]
s4 = 4
s8 = 8
s12 = 12
s16 = 16
s24 = 24
s32 = 32
s48 = 48
pageInset = 16
sectionGap = 24
# 聊天气泡照 Telegram（ADR-0109 第 9 节）：组内两条之间、组与组之间。
runGap = 2
groupGap = 6
# 气泡那一行离屏幕边；正文离气泡边（左右、上下）；气泡对面至少留出的空（屏宽减它就是气泡最宽）。
bubbleEdge = 4
bubbleInsetX = 11
bubbleInsetY = 6
bubbleOpposite = 36
# 浮在聊天内容上的玻璃层（顶栏、输入栏、命令列表）离屏幕边。
chatFloatInset = 8

# 圆角可以分平台（ADR-0029）。
[radii]
control = { ios = 14, android = 12 }
card = { ios = 20, android = 16 }
# 气泡照 Telegram（ADR-0109 第 9 节）：大圆角；组内贴近发送者一侧的小圆角。
bubble = 16
bubbleJoined = 8
# 网页变量 --border-radius-xs 的值（ADR-0033），和气泡分开，气泡改形状不动网页。
webXs = 6
pill = 999
bar = { ios = 999, android = 22 }
barItem = { ios = 999, android = 16 }
composerField = 20

[size]
target = 48
avatar = 48
topBar = 56
bottomBar = 64
icon = 24
iconSmall = 20
iconTiny = 14
sendButton = 36
composerField = 40
fileThumbnail = 44
menuBlur = 12
menuWidth = 200
menuElevation = 8
messageImage = 240
launcherIcon = 62
launcherCell = 76
storeIcon = 56
taskIcon = 40
floatingActionButton = 56
previewIcon = 64
detailIcon = 112
screenshot = 380
chip = 36
smallButton = 32
switchWidth = 44
switchHeight = 26
switchKnob = 22
dialogWidth = 320
grabberWidth = 36
grabberHeight = 4
hairline = 1
quoteBar = 2
# 浮在同色底上的一层（别人的气泡、选项按钮、卡片）靠投影分开：模糊半径、往下的偏移（ADR-0130）。
# 模糊半径只有 iOS 用；Compose 的 shadow 只认高度，Android 拿 shadowY 当 elevation，模糊由系统按高度算。
shadowBlur = 10
shadowY = 2
# 气泡尾巴伸出气泡的宽度，尾巴从底边往上占的高度（ADR-0109 第 9 节）。
bubbleTail = 6
bubbleTailRise = 9
# 聊天页浮着的玻璃圆钮、标题胶囊、输入框一行时的高度，顶栏头像的直径。
chatControl = 44
# 消息下选项按钮的高度；日期胶囊的高度；命令列表里 Bot 头像的直径。
choiceButton = 42
datePill = 22
commandAvatar = 28
# 群聊里别人组尾气泡旁边的头像（ADR-0109，估计值）。
messageAvatar = 34
# “/”命令列表最高这么高，再多就在里面滚（ADR-0109，估计值）。
commandMenu = 240
# 附件面板底下那排切换里一项的宽（ADR-0109，估计值）。
attachTab = 76

[ratio]
pluginIconRadius = 0.2237
secondaryContent = 0.7
scrim = 0.4
codeFill = 0.1
# 气泡最大宽度占可用宽度；输入框最多长到几行（ADR-0109，估计值）。
bubbleWidth = 0.8
composerLines = 6
# 聊天背景上细线图案的浓度，用 `textPrimary` 画（ADR-0109 第 9 节）。
wallPattern = 0.08
# 压在聊天背景上的日期胶囊、说明行和选项按钮的半透明底：浅色主题盖黑、深色主题盖白。
serviceFill = 0.32
serviceFillDark = 0.16
# 跳到原消息后整行闪的 `textPrimary` 浓度。
jumpHighlight = 0.12
# 附件面板那排切换里当前一项垫的 `textPrimary` 浓度（ADR-0109，估计值）。
tabHighlight = 0.1
# 投影的浓度（黑色）：深色底上同样的浓度看不出来，所以深色另取一档（ADR-0130）。
shadow = 0.08
shadowDark = 0.4

[typography]
screenTitle = { size = 28, line = 34, weight = "bold", relativeTo = "title" }
sectionTitle = { size = 20, line = 26, weight = "semibold", relativeTo = "title3" }
itemTitle = { size = 17, line = 24, weight = "medium", relativeTo = "headline" }
body = { size = 16, line = 22, weight = "regular", relativeTo = "body" }
supporting = { size = 14, line = 20, weight = "regular", relativeTo = "subheadline" }
caption = { size = 12, line = 16, weight = "regular", relativeTo = "caption" }
# 聊天页（ADR-0109 第 9 节）：气泡正文、气泡右下角的时间、群聊里的名字、选项按钮、日期胶囊、顶栏的标题和状态行。
message = { size = 16, line = 21, weight = "regular", relativeTo = "body" }
messageMeta = { size = 11, line = 13, weight = "regular", relativeTo = "caption2" }
senderName = { size = 14, line = 18, weight = "semibold", relativeTo = "subheadline" }
choice = { size = 15, line = 20, weight = "medium", relativeTo = "subheadline" }
datePill = { size = 13, line = 16, weight = "medium", relativeTo = "footnote" }
barTitle = { size = 17, line = 22, weight = "semibold", relativeTo = "headline" }
barStatus = { size = 13, line = 16, weight = "regular", relativeTo = "footnote" }

# 毫秒。系统“减少动态”打开时一律改用 reduced 的淡入淡出。
[motion]
feedback = 120
state = 180
panel = 240
messageInsert = 180
# 跳到原消息后高亮淡出；停止滚动后日期胶囊停留（ADR-0109，估计值）。
jumpHighlight = 1000
datePillHold = 1000
reduced = 100

# 距离以 pt/dp、速度以 pt/dp 每秒计；快甩仍须越过最小实际距离。
[gesture]
pullDistance = 96
pushDistance = 64
swipeDistance = 64
flickDistance = 32
flickVelocity = 900
dragSlop = 8
edgeWidth = 24
# 左滑整列消息露出时间时，最多挪开这么远。
timeReveal = 64
pageEdgeZone = 48
# 左滑回复：过这么远算回复，最多拖这么远（ADR-0109，估计值）。
replyTrigger = 64
replyMax = 88

# ADR-0033：公开变量只增不改名。颜色引用 ThemeColors，字体引用 AppearanceViewModel。
# --wonton-* 只注入根元素；--wonton-inset-* 由运行时环境提供。
[web_variables]
"--color-background-primary" = { color = "canvas" }
"--color-background-secondary" = { color = "surface_subtle" }
"--color-text-primary" = { color = "text_primary" }
"--color-text-secondary" = { color = "text_secondary" }
"--color-border-primary" = { color = "separator" }
"--color-background-danger" = { color = "danger" }
"--color-text-danger" = { color = "danger" }
"--color-border-danger" = { color = "danger" }
"--color-ring-danger" = { color = "danger" }
"--color-background-success" = { color = "success" }
"--color-text-success" = { color = "success" }
"--color-border-success" = { color = "success" }
"--color-ring-success" = { color = "success" }
"--color-background-warning" = { color = "warning" }
"--color-text-warning" = { color = "warning" }
"--color-border-warning" = { color = "warning" }
"--color-ring-warning" = { color = "warning" }
# 插件规范承诺过这三个名字，留着；没有重点色以后 fill 是强调填充，ink 是页面上的字色（ADR-0130）。
"--wonton-accent-fill" = { color = "primary" }
"--wonton-accent-ink" = { color = "text_primary" }
"--wonton-accent-ink-on-fill" = { color = "on_primary" }
"--border-radius-xs" = { radius = "webXs" }
"--border-radius-md" = { radius = "control" }
"--border-radius-lg" = { radius = "card" }
"--border-radius-full" = { radius = "pill" }
"--font-sans" = { font = "font" }
