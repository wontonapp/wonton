name: gate

# 合并门槛：PR 合并前要等的检查都在这一个工作流里，规则集只要求末尾的“gate 汇总”一个检查。
# - changes：一个作业按改动范围给出 rust、ios、android、docker 四个开关（之前三个工作流各起一个）。
# - lint：轻检查，不按路径过滤，草稿 PR 也跑。
# - rust、ios、android、docker：重作业在各自的工作流里（workflow_call），这里按开关调用；定时、手动和合后的运行
#   还是那几个工作流自己触发（docker 在 main 上由 rust-docker.yml 自己的 push 按路径跑，这里不跑）。
# - 汇总：needs 全部作业，任一失败或取消就红，成功和跳过算过；草稿 PR 上重作业全被跳过，汇总自己也判红——
#   否则「跳过算过」会让 gate 汇总在草稿阶段显示绿，gh pr merge --auto 转 ready 后立刻看到已绿的必需检查就合了，
#   重作业一次没跑（11-13 #470 21:59Z 就这样合进了 main）。转 ready 的新 run 才给真结果。
# 一次推送只起 changes、lint、汇总三个轻作业加改到的重作业（之前是三个改动范围、四个汇总加 lint），
# 省下的是 runner 名额和排队，重作业本身不变。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    # edited 也跑：改 base 时 GitHub 不保证再发 synchronize（#1208/#1233/#1244 推完零 run，关/开才有）。
    # 代价是改标题/正文也会重跑一轮全量 gate；比 base 改了没有检查、PR 永远合不了好。
  # 手动补一轮：用工作流自带的 GITHUB_TOKEN 推的提交不触发新工作流，PR 上会一条检查都没有，
  # 这时手动跑 `gh workflow run gate.yml --ref <branch>`。
  workflow_dispatch:
  # main 上跑 lint（密钥扫描这一个提交）和全量 rust；ios/android 交给夜间兜底，docker 交给 rust-docker.yml 自己的 push。
  push:
    branches: [main]

# 同一个 PR 又推了新提交，旧的整轮取消（含调用的重作业），别占着 runner；main 上的每次合并都跑完。
concurrency:
  group: gate-${{ github.ref }}${{ github.event.action == 'edited' && github.event.changes.base == null && '-meta' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: 改动范围
    # PR 用 REST 列改动文件，不用检出代码；草稿 PR 跳过，重作业跟着跳过。
    # push（合进 main）也进这个作业：main 上 rust 一律全跑——合后必须真验一遍，之前只在每天 3 点的定时里跑，
    # 合进 main 的提交到那时之前一次单测都没有（11-13 #470 就是这样合进去的）。ios/android 合后仍交给夜间兜底；
    # docker 合后由 rust-docker.yml 自己的 push 跑，这里不重复触发。
    # edited 只在改 base 时干活：改 body/title 也发 edited，不挡就整晚重跑全量。
    if: ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # 按 REST 接口列 PR 改动的文件，不用检出代码。
      pull-requests: read
    outputs:
      rust: ${{ steps.pushrun.outputs.rust || steps.filter.outputs.rust }}
      ios: ${{ steps.pushrun.outputs.ios || steps.filter.outputs.ios }}
      android: ${{ steps.pushrun.outputs.android || steps.filter.outputs.android }}
      docker: ${{ steps.pushrun.outputs.docker || steps.filter.outputs.docker }}
    steps:
      - name: main push：rust 全跑，docker 交给 rust-docker.yml
        id: pushrun
        if: github.event_name == 'push'
        run: |
          echo "rust=true" >> "$GITHUB_OUTPUT"
          echo "ios=false" >> "$GITHUB_OUTPUT"
          echo "android=false" >> "$GITHUB_OUTPUT"
          echo "docker=false" >> "$GITHUB_OUTPUT"
      # dispatch 没有 PR 事件负载，paths-filter 的 base/ref 模式要读本地 git，得先检出。两个 action 都是 MIT。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'push'
        with:
          # 只在这个工作流被 dispatch 时给：按 ref 和 main 比文件；PR 上留空，dorny 自己用 PR 的 base/head。
          base: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || '' }}
          # 和 GitHub 自己的 paths 一样按文件判断：命中任意一条正向规则、且不命中任何 ! 排除项才算改到。
          predicate-quantifier: some-with-excludes
          filters: |
            rust:
              - "crates/**"
              # 开发工具 crate，和产品 crate 同规则。
              - "crates/wonton-onboard/**"
              # 测试和预热读的部署文件（include_str! 和 Dockerfile）；deploy/dev 其余的只给本机开发栈，改了不用跑。
              # 新的 include_str! 指向 deploy/ 时要补在这里。
              - "deploy/install/**"
              - "deploy/dev/core/compose.yaml"
              - "deploy/dev/core/Dockerfile"
              - "deploy/dev/matrix/**"
              - "plugins/**"
              # 镜像清单检查（wonton-core 的 test_docker_check）要运行它。
              - "scripts/mirror-test-images.sh"
              - "Cargo.toml"
              - "vendor/**"
              - "Cargo.lock"
              - "clippy.toml"
              - ".config/nextest.toml"
              - "rust-toolchain.toml"
              - ".github/workflows/rust.yml"
              - ".github/workflows/gate.yml"
              - "!**/*.md"
            # PR 上只看 Swift 这边和导出给 Swift 的接口；wonton-client 依赖的其余 crate 在合后跑，范围和理由见 ios.yml 开头。
            ios:
              - "apps/ios/**"
              - "design/**"
              - "scripts/generate-design.py"
              - "crates/wonton-client/**"
              - "crates/wonton-protocol/**"
              - ".github/workflows/ios.yml"
              - ".github/workflows/gate.yml"
              # 核心产物的键和产物怎么编（cache.yml）：改了就对不上，得真编一遍。
              - "scripts/core_artifacts/**"
              - ".github/workflows/cache.yml"
              - "!**/*.md"
              - "!crates/**/tests/**"
              - "!crates/**/benches/**"
              - "!crates/**/tests.rs"
              - "!crates/**/*_tests.rs"
            android:
              - "apps/compose/**"
              - "apps/ios/Wonton/Assets.xcassets/**"
              - "apps/ios/Wonton/Design/Generated/**"
              - "design/**"
              - "scripts/generate-design.py"
              - "crates/wonton-client/**"
              - "crates/wonton-matrix/**"
              - "crates/wonton-protocol/**"
              - "crates/wonton-tunnel/**"
              - "Cargo.toml"
              - "vendor/**"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/android.yml"
              - ".github/workflows/gate.yml"
              - "scripts/core_artifacts/**"
              - ".github/workflows/cache.yml"
              - "!**/*.md"

            # Docker 集成测试：和 rust-docker.yml 的 push 触发器同一份路径范围，改一处要改另一处。
            # PR 上由下面的 docker 作业调用、算合并门槛；main 上 rust-docker.yml 自己的 push 跑。
            # 改了 gate.yml、rust-docker.yml 本身也要重跑一遍：gate 和 docker 的接线改了得真验。
            docker:
              - "crates/wonton-client/**"
              - "crates/wonton-core/**"
              - "crates/wonton-matrix/**"
              # 测试和预热读的部署文件（include_str! 和 Dockerfile）；新的 include_str! 指向 deploy/ 时要补。
              - "deploy/install/**"
              - "deploy/dev/core/compose.yaml"
              - "deploy/dev/core/Dockerfile"
              - "deploy/dev/matrix/**"
              # 预拉测试镜像的清单。
              - "scripts/mirror-test-images.sh"
              - "plugins/**"
              - "Cargo.toml"
              - "vendor/**"
              - "Cargo.lock"
              - "clippy.toml"
              - ".config/nextest.toml"
              - "rust-toolchain.toml"
              - ".github/workflows/rust-docker.yml"
              - ".github/workflows/gate.yml"
              - "!**/*.md"

  lint:
    name: lint
    if: ${{ (github.event.action != 'edited' || github.event.changes.base != null) }}
    uses: ./.github/workflows/lint.yml

  # 重作业的 if 以 !cancelled() 开头：只要这轮没被取消就按开关判断。开关只有 changes 跑了才有值：
  # 草稿 PR 上 changes 跳过，这些跟着跳过；push 上 pushrun 直接给值。
  rust:
    name: rust
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && (github.event.action != 'edited' || github.event.changes.base != null) }}
    uses: ./.github/workflows/rust.yml

  ios:
    name: ios
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios == 'true' && (github.event.action != 'edited' || github.event.changes.base != null) }}
    uses: ./.github/workflows/ios.yml

  android:
    name: android
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.android == 'true' && (github.event.action != 'edited' || github.event.changes.base != null) }}
    uses: ./.github/workflows/android.yml

  # Docker 集成测试。PR 上算合并门槛（changes 的 docker 开关）；main 上不经过这里：
  # rust-docker.yml 自己的 push 按同一份路径跑，红了按提交标题里的 (#N) 找到弄红的 PR。
  docker:
    name: docker
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docker == 'true' && (github.event.action != 'edited' || github.event.changes.base != null) }}
    permissions:
      contents: read
      # 拉 ghcr 上的测试镜像副本。
      packages: read
    uses: ./.github/workflows/rust-docker.yml

  # 必需检查只有这一个：任一作业失败或被取消就红，成功和跳过算过。规则集按这个名字配，
  # 草稿 PR 上重作业全被跳过时它也照样起来并报通过。范围判断失败时它的 result 是 failure，汇总跟着红，
  # 不会伪装成没改动。
  summary:
    name: gate 汇总
    needs: [changes, lint, rust, ios, android, docker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      # body/title-only 的 edited 要读上一轮真 run 的 gate 汇总，把它镜像出来；不能让改正文把红洗成绿。
      actions: read
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: 草稿 PR 不跑重作业
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "::error::草稿 PR：rust/android/ios/docker 重作业按设计没跑，这份汇总不算数——转 ready 会重跑，以那次为准"
          exit 1
      - name: 各作业的结果
        if: github.event.action != 'edited' || github.event.changes.base != null
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
      # 改标题/正文也发 edited，但这里没有重作业。改 body 时把“同一个 head 上一轮真 gate”的汇总结论
      # 原样映到本轮：成功照旧绿、失败照旧红，规则集/队列/land 看到的永远是 SUCCESS/FAILURE，不是 SKIPPED。
      # 真 run 还在跑就等它完（必需检查只看最新 suite，旧 suite 晚到盖不过新 suite）。
      - name: 镜像上一轮真 gate 的结果
        if: github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 80 * 60 ))
          while :; do
            runs=$(gh api "repos/$REPO/actions/runs?event=pull_request&head_sha=$HEAD&per_page=100" --paginate \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/gate.yml" and (.id | tostring) != env.SELF)] | sort_by(.created_at) | reverse | .[] | [.id, .status, (.conclusion // "")] | @tsv')
            real=""
            while IFS=$'\t' read -r id status conclusion; do
              [ -n "$id" ] || continue
              jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | {name, conclusion}]') || continue
              # 真 run 至少有一个非汇总的作业（草稿/空范围的 run 也可能只有 lint）；全 skipped 的 body run 没有。
              if jq -e '[.[] | select(.name != "gate 汇总" and .conclusion != "skipped")] | length > 0' >/dev/null <<<"$jobs"; then
                real=$id; summary=$(jq -r '[.[] | select(.name == "gate 汇总") | .conclusion // ""] | first // ""' <<<"$jobs")
                break
              fi
            done <<<"$runs"
            [ -n "$real" ] || { echo "这个 head 还没有真实 gate run，15 秒后再找"; sleep 15; continue; }
            if [[ "$status" != completed ]]; then
              echo "上一轮真 gate（run $real）还在 $status，等它完"
              (( $(date +%s) < deadline )) || { echo "等上一轮真 gate 超时"; exit 1; }
              sleep 15
              continue
            fi
            echo "镜像 run $real 的 gate 汇总：${summary:-缺失}"
            [ "$summary" = success ] || exit 1
            exit 0
          done
