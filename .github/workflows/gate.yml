name: gate

# 合并门槛：PR 合并前要等的检查都在这一个工作流里，规则集只要求末尾的“gate 汇总”一个检查。
# - changes：一个作业按改动范围给出 rust、ios、android 三个开关（之前三个工作流各起一个）。
# - lint：轻检查，不按路径过滤，草稿 PR 也跑。
# - rust、ios、android：重作业在各自的工作流里（workflow_call），这里按开关调用；定时、手动和合后的运行
#   还是那几个工作流自己触发。
# - 汇总：needs 全部作业，任一失败或取消就红，成功和跳过算过。
# 一次推送只起 changes、lint、汇总三个轻作业加改到的重作业（之前是三个改动范围、四个汇总加 lint），
# 省下的是 runner 名额和排队，重作业本身不变。
# 路径不写在触发器上：必需检查在每个 PR 上都要有结果，工作流没触发的话检查一直“等待中”，PR 合不了。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # main 上只跑 lint（密钥扫描这一个提交）；合后的慢测试在 rust-docker.yml、ios.yml 的 push 上。
  push:
    branches: [main]

# 同一个 PR 又推了新提交，旧的整轮取消（含调用的重作业），别占着 runner；main 上的每次合并都跑完。
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: 改动范围
    # PR 用 REST 列改动文件，不用检出代码；草稿 PR 和 push 跳过，重作业跟着跳过。
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # 按 REST 接口列 PR 改动的文件，不用检出代码。
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      # MIT
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # 和 GitHub 自己的 paths 一样按文件判断：命中任意一条正向规则、且不命中任何 ! 排除项才算改到。
          predicate-quantifier: some-with-excludes
          filters: |
            rust:
              - "crates/**"
              # 测试和预热读的部署文件（include_str! 和 Dockerfile）；deploy/dev 其余的只给本机开发栈，改了不用跑。
              # 新的 include_str! 指向 deploy/ 时要补在这里。
              - "deploy/install/**"
              - "deploy/dev/acp-bridge/**"
              - "deploy/dev/core/compose.yaml"
              - "deploy/dev/core/Dockerfile"
              - "deploy/dev/matrix/**"
              - "plugins/**"
              # 镜像清单检查（wonton-core 的 test_docker_check）要运行它。
              - "scripts/mirror-test-images.sh"
              - "Cargo.toml"
              - "vendor/**"
              - "Cargo.lock"
              - "clippy.toml"
              - ".config/nextest.toml"
              - "rust-toolchain.toml"
              - ".github/workflows/rust.yml"
              - ".github/workflows/gate.yml"
              - "!**/*.md"
            # PR 上只看 Swift 这边和导出给 Swift 的接口；wonton-client 依赖的其余 crate 在合后跑，范围和理由见 ios.yml 开头。
            ios:
              - "apps/ios/**"
              - "design/**"
              - "scripts/generate-design.py"
              - "crates/wonton-client/**"
              - "crates/wonton-protocol/**"
              - ".github/workflows/ios.yml"
              - ".github/workflows/gate.yml"
              - "!**/*.md"
              - "!crates/**/tests/**"
              - "!crates/**/benches/**"
              - "!crates/**/tests.rs"
              - "!crates/**/*_tests.rs"
            android:
              - "apps/compose/**"
              - "apps/ios/Wonton/Assets.xcassets/**"
              - "apps/ios/Wonton/Design/Generated/**"
              - "design/**"
              - "scripts/generate-design.py"
              - "crates/wonton-client/**"
              - "crates/wonton-matrix/**"
              - "crates/wonton-protocol/**"
              - "crates/wonton-tunnel/**"
              - "Cargo.toml"
              - "vendor/**"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/android.yml"
              - ".github/workflows/gate.yml"
              - "!**/*.md"

  lint:
    name: lint
    uses: ./.github/workflows/lint.yml

  # 重作业的 if 以 !cancelled() 开头：只要这轮没被取消就按开关判断；开关只有 changes 跑了才有值，
  # 草稿 PR 和 push 上 changes 跳过，这三个跟着跳过。
  rust:
    name: rust
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/rust.yml

  ios:
    name: ios
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios == 'true' }}
    uses: ./.github/workflows/ios.yml

  android:
    name: android
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.android == 'true' }}
    uses: ./.github/workflows/android.yml

  # 必需检查只有这一个：任一作业失败或被取消就红，成功和跳过算过。规则集按这个名字配，
  # 草稿 PR 上重作业全被跳过时它也照样起来并报通过。范围判断失败时它的 result 是 failure，汇总跟着红，
  # 不会伪装成没改动。
  summary:
    name: gate 汇总
    needs: [changes, lint, rust, ios, android]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: 各作业的结果
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
