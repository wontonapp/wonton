name: lint

# 轻检查，草稿 PR 也跑。冲突标记和密钥可能写在任何文件里（.md 也算），不按路径过滤，所以不能并进
# 带 paths-ignore 的工作流。结构门禁只查源码文件，只改文档的提交跳过。
on:
  pull_request:
  push:
    branches: [main]
  # 合并队列：这三个作业都是必需检查，入队后的合并提交上也要报告，否则队列直接判失败。
  # merge_group 不认 paths，路径过滤只留在 pull_request 下自己生效。
  merge_group:
    types: [checks_requested]
    branches: [main]

# 同一个 PR 又推了新提交，旧的运行就取消，别占着 runner；main 上的每次合并都跑完。
# 队列里的 ref 一律是 gh-merge-queue/main，按它分组会把几次入队挤进同一组，改用这次入队的合并提交。
concurrency:
  group: lint-${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  structure:
    name: 结构门禁
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # 插件包的版本检查只比当前提交和它的第一个父提交：PR 上检出的是合并提交，第一个父提交就是 base 的最新提交；
          # push 到 main 时是上一个提交。拉全部历史太重。
          fetch-depth: 2
          persist-credentials: false
      - name: 只改了文档就不跑（结构门禁只查源码文件）
        id: changes
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '(^docs/|\.md$)'; then
            echo "source=true" >> "$GITHUB_OUTPUT"
          else
            echo "source=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 装 lefthook（版本和 sha256 固定）
        if: steps.changes.outputs.source == 'true'
        run: |
          curl -fsSL --retry 3 -o lefthook.gz \
            https://github.com/evilmartians/lefthook/releases/download/v2.2.2/lefthook_2.2.2_Linux_x86_64.gz
          echo "2b8d7fd52771f26d7a50260ef10cd6fe704d66f60102e566362b84da09884ab7  lefthook.gz" | sha256sum -c -
          gunzip lefthook.gz
          chmod +x lefthook
      # 行数门禁、界面文字：和本地提交前的检查是同一份 lefthook.yml，这里查全部文件。
      # 格式不在这里查：rustfmt 会直接把文件改对，挡不住没格式化的提交；它由 rust 工作流的“格式”作业（cargo fmt --check）管。
      - name: lefthook 的 pre-commit（行数门禁、界面文字）
        if: steps.changes.outputs.source == 'true'
        env:
          LEFTHOOK_EXCLUDE: rustfmt
        run: ./lefthook run pre-commit --all-files
      - name: 界面文字检查自己的用例
        if: steps.changes.outputs.source == 'true'
        run: python3 -m unittest discover -s scripts/ui_text -t scripts
      - name: 开发栈端口检查自己的用例
        if: steps.changes.outputs.source == 'true'
        run: python3 -m unittest discover -s scripts/dev_ports -t scripts
      - name: dev.sh 实例标签的用例
        if: steps.changes.outputs.source == 'true'
        run: python3 deploy/dev/core/instance-label_test.py
      - name: dev.sh 的 logs 和 diag（假 docker，不用真的 Docker）
        if: steps.changes.outputs.source == 'true'
        run: python3 deploy/dev/core/dev_test.py
      - name: 开发栈端口只绑 127.0.0.1
        if: steps.changes.outputs.source == 'true'
        run: python3 scripts/check-dev-compose-ports.py
      - name: 随核心带的插件包改了文件就升版本号
        if: steps.changes.outputs.source == 'true'
        run: bash scripts/check-bundled-plugin-versions.sh HEAD^1
      - name: 生成绑定的 crate 的文档注释能进 Swift 和 Kotlin 的块注释
        if: steps.changes.outputs.source == 'true'
        run: bash scripts/check-uniffi-comments.sh
      - name: 安装脚本的行为测试（假 docker，不用真的 Docker）
        if: steps.changes.outputs.source == 'true'
        run: python3 -m unittest discover -q -s scripts/install -t scripts

  conflict-markers:
    name: 冲突标记检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 残留的合并冲突标记
        run: bash scripts/check-conflict-markers.sh

  gitleaks:
    name: 密钥扫描
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # PR 上检出的是合并提交，第一个父提交就是 base 的最新提交；push 到 main 时是上一个提交。
          # HEAD^1..HEAD 恰好是这次带进来的提交的合并差异；main 每次 squash 合并推一个提交。
          fetch-depth: 2
          persist-credentials: false
      - name: 装 gitleaks（版本和 sha256 固定）
        run: |
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: 扫描这次带进来的提交
        run: ./gitleaks git --log-opts="HEAD^1..HEAD" --config .gitleaks.toml --redact --no-banner
      - name: 行为测试：扫得出也挡得住
        run: PATH="$PWD:$PATH" bash scripts/test-gitleaks.sh
