name: release

# 推 vX.Y.Z 的 tag 时构建核心镜像（amd64、arm64），推到 GHCR（ADR-0012）。带连字符的预发布版本（v0.2.0-beta.1）只更新
# beta 渠道，正式版本同时更新 stable 和 beta。安装脚本和 App 里的升级都按 digest 记版本，渠道只是找新版本的入口。
# 只认版本号的 tag（v1.2.3、v1.2.3-beta.1），误推的 vfoo 不会发布。
# 手动触发（只认 main）只发桥镜像，标签 main-<短提交号>，不碰任何渠道：桥和插件一起改名时，插件要先钉上新桥，
# 不必为此发一版核心。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  core-image:
    name: 核心镜像
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # runner 环境里的代理监听在主机的回环地址上，构建步骤（cargo 下载依赖）用 host 网络才连得上。
      - name: 版本、渠道和代理
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wonton-core"
          tags="$image:$version,$image:beta"
          case "$version" in *-*) ;; *) tags="$tags,$image:stable" ;; esac
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "http_proxy=${http_proxy:-}"
            echo "https_proxy=${https_proxy:-}"
          } >> "$GITHUB_OUTPUT"
      # 容器里的构建器：Docker 自带的构建器用的是 Docker 的镜像存储，本机已有 amd64 的 debian:trixie-slim 时，构建 arm64
      # 也拿它当基础镜像（Docker 29.7.2、overlayfs 存储驱动上实测，镜像里的 arm64 程序找不到动态链接器）。每次都是新的
      # 构建器，Rust 从头编译。构建器自己的镜像 moby/buildkit 要预先放在 runner 主机上：国内的主机连不上 Docker Hub
      # （所以基础镜像也改从 ECR Public 拉，见 Dockerfile）。
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dev/core/Dockerfile
          platforms: linux/amd64,linux/arm64
          network: host
          allow: network.host
          build-args: |
            http_proxy=${{ steps.meta.outputs.http_proxy }}
            https_proxy=${{ steps.meta.outputs.https_proxy }}
            WONTON_BUILD_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true

  acp-bridge-image:
    name: ACP bridge 镜像
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, docker]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: 版本和代理
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wonton-acp-bridge"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="main-${GITHUB_SHA::7}"
            tags="$image:$version"
          else
            version="${GITHUB_REF_NAME#v}"
            tags="$image:$version,$image:beta"
            case "$version" in *-*) ;; *) tags="$tags,$image:stable" ;; esac
          fi
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "http_proxy=${http_proxy:-}"
            echo "https_proxy=${https_proxy:-}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dev/acp-bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          network: host
          allow: network.host
          build-args: |
            http_proxy=${{ steps.meta.outputs.http_proxy }}
            https_proxy=${{ steps.meta.outputs.https_proxy }}
            CARGO_BUILD_JOBS=8
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
