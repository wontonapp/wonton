name: test-images

# 冒烟的验收工具镜像（tunnel-client、echo-bot）：插件仓库的 Agent 冒烟和 e2e 要按摘要拉它们，
# 不发布就得每台机器现编。合进 main 就构建，推 ghcr 的 :main 和 :sha-<完整提交号>；
# 打 tag（手动触发）推 :<tag>，用 tag 里的摘要固定。跟 main-image.yml 一样不是发版。
on:
  push:
    branches: [main]
    paths:
      - deploy/dev/core/Dockerfile
      - deploy/dev/core/Cargo.lock
      - .github/workflows/test-images.yml
  workflow_dispatch:
    inputs:
      tag:
        description: 这次的镜像 tag（不带冒号）
        required: true
        default: main

concurrency:
  group: test-images-${{ github.ref }}-${{ matrix.target }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [tunnel-client, echo-bot]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 镜像标签
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wonton-${{ matrix.target }}"
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo "tags=$image:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:main,$image:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "cache=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wonton-ci-cache:${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/push-image
        with:
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          file: deploy/dev/core/Dockerfile
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'main' }}
          extra-build-args: |-
            WONTON_BUILD_COMMIT=${{ github.sha }}
          cache-ref: ${{ steps.meta.outputs.cache }}
          cache-write: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
