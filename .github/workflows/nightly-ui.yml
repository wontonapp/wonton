name: nightly-ui

# 界面测试的夜跑：每晚在模拟器上把两端的 UI 测试走一遍，失败自动开 issue。
# 只定时和手动跑，不挂 PR 和合并队列，也不设必需检查——先连续两周稳定（失败都查清是真问题），
# 再把“启动到首屏 + 一个关键流程”升进合并队列。
#
# 时间直接沿用现有定时（ios.yml 的 30 4 * * *、android.yml 的 0 4 * * *）：一个工作流两个 cron，
# 作业按 github.event.schedule 分给自己那一条，不另占时间。手动触发两端都跑。
#
# 安卓托管机器的模拟器跑不了 ARM 的 .so，构建传 -Pwonton.abis=x86_64。
on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      pairing_code:
        description: 开发栈的配对码（可选，10 分钟内有效；没有时只有不需要后端的用例会跑）
        required: false

# 夜跑排到第二天还没跑完时不取消上一轮。
concurrency:
  group: nightly-ui
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

permissions:
  contents: read

jobs:
  ios:
    name: 夜跑 iOS UI 测试
    if: github.event.schedule != '0 4 * * *'
    runs-on: xcode-27
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
    env:
      XCODEGEN_VERSION: "2.46.0"
      # 要后端的走屏（好友、粘贴、安装行、图片查看、Bot 资料）读这两个变量；没有就 XCTSkip。
      WONTON_DEV_PAIRING_CODE: ${{ inputs.pairing_code }}
      PAIR_CODES: ${{ inputs.pairing_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 用 Xcode 27.1（和开发机一致）
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: 安装 rust-toolchain.toml 指定的工具链和 iOS 模拟器 target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 和 ios.yml 共用 key：cache.yml 在 main 上用同一个 key 编，夜跑才不用每次冷编。
          shared-key: rust-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 安装 XcodeGen（版本和 sha256 固定）
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/xcodegen"
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: 编译 Rust 核心并生成 Swift 绑定
        env:
          WONTON_IOS_TARGETS: aarch64-apple-ios-sim
        run: apps/ios/scripts/build-core.sh debug
      - name: 生成 Xcode 工程
        run: xcodegen generate --spec apps/ios/project.yml
      # 只开一台模拟器：型号取镜像里最新系统上的第一台 iPhone，镜像换了也不用改工作流。
      - name: 选一台 iPhone 模拟器并启动
        timeout-minutes: 10
        run: |
          UDID=$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          # 折屏（Duo）有两个显示，simctl recordVideo 不指定 --display 会等 5 分钟再报错，跳过它。
          # 同系统上优先成熟型号：最新那一代在镜像里刚上线，装测试包时崩过 CoreSimulator。
          available = [d for runtime in sorted(devices, reverse=True) for d in devices[runtime]]
          for name in ["iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro", "iPhone 16"]:
              for device in available:
                  if device["name"] == name:
                      print(device["udid"])
                      raise SystemExit
          for device in available:
              if device["name"].startswith("iPhone") and "Duo" not in device["name"]:
                  print(device["udid"])
                  raise SystemExit
          raise SystemExit("镜像里没有可用的 iPhone 模拟器")
          PY
          )
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          # 上一轮结束不干净时 CoreSimulator 会卡住或崩（Mach -308），先全停再擦掉这台。
          xcrun simctl shutdown all || true
          xcrun simctl erase "$UDID" || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      # 先只编测试包：录屏和跑测试分开，安装 App 时不和启动的模拟器抢。
      - name: 编测试包
        timeout-minutes: 30
        run: |
          xcodebuild build-for-testing \
            -project apps/ios/Wonton.xcodeproj \
            -scheme Wonton \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:WontonUITests \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
      - name: 跑 WontonUITests 并录屏
        timeout-minutes: 20
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/ui.xcresult"
          # 等测试包装好、App 起起来再录：模拟器刚启动时最容易被安装和录屏一起拽死。
          (sleep 30; exec xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 "$RUNNER_TEMP/ui.mp4") &
          recorder=$!
          # recordVideo 收到 SIGINT 才把文件收尾。
          trap 'kill -INT "$recorder" 2>/dev/null; wait "$recorder" 2>/dev/null || true' EXIT
          xcodebuild test-without-building \
            -project apps/ios/Wonton.xcodeproj \
            -scheme Wonton \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            -only-testing:WontonUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 90 \
            -maximum-test-execution-time-allowance 600 \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -skip-testing:WontonUITests/PasteUITests/testPeerShowsImage \
            -skip-testing:WontonUITests/FriendsRoleUITests
      - name: 上传结果和录屏
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ui-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/ui.mp4
          retention-days: 14
          if-no-files-found: warn
      - name: 失败时开 issue 或留言
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/nightly-ui-report.py \
            --repo "${{ github.repository }}" --platform ios \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --xcresult "$RUNNER_TEMP/ui.xcresult"

  android:
    name: 夜跑 Android UI 测试
    if: github.event.schedule != '30 4 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: 安装 rust-toolchain.toml 指定的工具链和 Android target
        run: |
          rustup toolchain install
          rustup target add x86_64-linux-android
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-ndk@4.1.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 和 android.yml 共用 key（cache.yml 在 main 上编）。
          shared-key: rust-android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # 模拟器要 KVM：官方文档的 udev 规则写法（ubuntu-24.04 默认只有 root 能读写 /dev/kvm）。
      - name: 打开 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 跑 androidTest 并录屏
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          # 无窗口、软件 GPU：托管机器没有 GPU。快照和音频用不上。
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            # screenrecord 的 --time-limit 最多 180 秒；用例超过就截到 180 秒，失败截图另有测试报告。
            # /data/local/tmp 是 shell 能写的地方（API 36 上 /sdcard 根目录不行）。
            adb shell screenrecord --size 720x1280 --time-limit 180 /data/local/tmp/ui.mp4 &
            # 脚本的每行是单独的 sh：构建、抓产物和退出码要写在同一行里。
            (cd apps/compose && ./gradlew --no-daemon --no-build-cache -Pwonton.abis=x86_64 :androidApp:connectedDebugAndroidTest); status=$?; adb pull /data/local/tmp/ui.mp4 "$RUNNER_TEMP/ui.mp4" || true; mkdir -p "$RUNNER_TEMP/shots"; adb pull /sdcard/Pictures/WontonUITests "$RUNNER_TEMP/shots" || true; exit $status
      - name: 上传结果和录屏
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-ui-${{ github.run_id }}
          path: |
            apps/compose/androidApp/build/reports/androidTests/connected
            apps/compose/androidApp/build/outputs/androidTest-results/connected
            ${{ runner.temp }}/ui.mp4
            ${{ runner.temp }}/shots
          retention-days: 14
          if-no-files-found: warn
      - name: 失败时开 issue 或留言
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/nightly-ui-report.py \
            --repo "${{ github.repository }}" --platform android \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --results-dir apps/compose/androidApp/build/outputs/androidTest-results
