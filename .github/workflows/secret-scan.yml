name: secret-scan

# 密钥可能写在任何文件里（.md 也算），不按路径过滤：不能并进 ci.yml，它有 paths-ignore 会跳过文档。
# 只扫这次带进来的提交（见下面 checkout 的注释），不扫全部历史。
# 不用 gitleaks-action：它对组织仓库要许可证 key。gitleaks 是 MIT 许可的官方发布二进制，
# 版本和 sha256 固定在下面的安装步骤里。
on:
  pull_request:
  push:
    branches: [main]

# 同一个 PR 又推了新提交，旧的运行就取消，别占着 runner；main 上的每次合并都跑完。
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: 密钥扫描
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          # PR 上检出的是合并提交，第一个父提交就是 base 的最新提交；push 到 main 时是上一个提交。
          # HEAD^1..HEAD 恰好是这次带进来的提交的合并差异；main 每次 squash 合并推一个提交。
          # 拉全部历史太重，机器网络一抖 `--unshallow` 就断。
          fetch-depth: 2
      - name: 装 gitleaks（版本和 sha256 固定）
        run: |
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: 扫描这次带进来的提交
        run: ./gitleaks git --log-opts="HEAD^1..HEAD" --config .gitleaks.toml --redact --no-banner
      - name: 行为测试：扫得出也挡得住
        run: PATH="$PWD:$PATH" bash scripts/test-gitleaks.sh
