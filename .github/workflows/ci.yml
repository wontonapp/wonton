name: ci

# 每次都跑，它很快；Rust 和 Docker 测试在 rust.yml。只改文档的提交不跑：结构门禁只查源码文件。
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

# 同一个 PR 又推了新提交，旧的运行就取消，别占着 runner；main 上的每次合并都跑完。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  structure:
    name: 结构门禁
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - name: 源码文件不超过 800 行
        run: bash scripts/check-file-size.sh
      - name: 界面文字检查自己的用例
        run: python3 -m unittest discover -s scripts/ui_text -t scripts
      - name: 界面文字不写死，四种语言的字符串目录完整
        run: python3 scripts/check-ui-text.py
      - name: 生成绑定的 crate 的文档注释能进 Swift 和 Kotlin 的块注释
        run: bash scripts/check-uniffi-comments.sh
