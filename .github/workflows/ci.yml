name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  structure:
    name: 结构门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 源码文件不超过 800 行
        run: bash scripts/check-file-size.sh

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: 格式
        run: cargo fmt --all --check
      - name: Clippy（含函数不超过 100 行）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 测试（不含依赖 Docker 的集成测试）
        run: cargo test --workspace --locked
        env:
          # 故意让 Docker 不可用，保证默认的测试不依赖它：依赖 Docker 的测试标了 #[ignore]，由下面的作业运行。
          DOCKER_HOST: unix:///nonexistent/docker.sock

  docker-tests:
    name: Docker 集成测试
    runs-on: ubuntu-latest
    # 起容器、拉镜像最容易卡住，不要占满默认的 6 小时。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: 确认 Docker 可用
        run: docker version
      - name: wonton-matrix 对真实 Tuwunel 的集成测试
        run: cargo test -p wonton-matrix --locked --test tuwunel -- --include-ignored
