name: ios

# 自托管 runner（ADR-0012 的“CI”）：SwiftLint 在 Linux 上的容器里跑；macOS 上只做一次模拟器构建（只编译
# Apple 芯片模拟器一个 target，不签名、不跑模拟器）。
on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "crates/wonton-client/**"
      - "crates/wonton-protocol/**"
      - "crates/wonton-tunnel/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "crates/wonton-client/**"
      - "crates/wonton-protocol/**"
      - "crates/wonton-tunnel/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint（函数体 ≤ 100 行、文件 ≤ 800 行）
    runs-on: [self-hosted, Linux, X64, docker]
    steps:
      - uses: actions/checkout@v5
      # 不用 container 作业：容器里以 root 检出和写文件，留在自托管 runner 工作区里的文件 runner 自己删不掉，
      # 之后的作业检出就会失败。这里以 runner 的用户身份起容器；镜像里的缓存目录只有 root 能写，所以关掉缓存。
      - name: SwiftLint
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work/apps/ios \
            ghcr.io/realm/swiftlint:0.65.1 swiftlint lint --strict --no-cache

  build:
    name: 模拟器构建
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 30
    env:
      XCODEGEN_VERSION: "2.46.0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/../../_cargo-target/ios
    steps:
      - uses: actions/checkout@v5
      - name: 安装 rust-toolchain.toml 指定的工具链和 iOS 模拟器 target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - name: 安装 XcodeGen（按版本放进 runner 的工具缓存，下次直接用）
        run: |
          dir="$RUNNER_TOOL_CACHE/xcodegen/$XCODEGEN_VERSION"
          if [[ ! -x "$dir/xcodegen/bin/xcodegen" ]]; then
            curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
              "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
            mkdir -p "$dir"
            unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$dir"
          fi
          echo "$dir/xcodegen/bin" >> "$GITHUB_PATH"
      - name: 编译 Rust 核心并生成 Swift 绑定
        env:
          WONTON_IOS_TARGETS: aarch64-apple-ios-sim
        run: apps/ios/scripts/build-core.sh debug
      - name: 生成 Xcode 工程
        run: xcodegen generate --spec apps/ios/project.yml
      - name: 构建 App
        run: |
          xcodebuild -version
          xcodebuild build \
            -project apps/ios/Wonton.xcodeproj \
            -scheme Wonton \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
