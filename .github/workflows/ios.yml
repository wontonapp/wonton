name: ios

# 托管 macOS（仓库公开后 macOS 分钟免费）：SwiftLint，和一次模拟器构建（只编译 Apple 芯片模拟器一个
# target，不签名、不跑模拟器）。PR 上只在改到 iOS 相关文件时跑；草稿 PR 不跑，转 ready 或每天的定时
# 全量才跑。main 上不重跑（PR 已在最新 main 上跑过），定时兜底。
# 触发的 crate 是 wonton-client 在工作区里的全部依赖（cargo tree -p wonton-client --features bindgen --target all），
# 加了依赖要同步改这份列表。只改测试的 PR（crates 下的 tests/、benches/、tests.rs、*_tests.rs）编不进 iOS App，排除掉。
# 路径不写在触发器上：合并队列的必需检查每次入队都要有结果，工作流没触发的话检查一直“等待中”，队列合不了。
# 改成由 changes 作业判断改动范围，作业挂在它上面，没改到时自己报 skipped（跳过的检查算通过）。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 每天全量兜底（PR 已在最新 main 上跑过，main 上不重跑）。
    - cron: "30 4 * * *"
  workflow_dispatch:
  # 合并队列：SwiftLint 和模拟器构建是必需检查，入队后的合并提交上也要报告，否则队列直接判失败。
  # 队列里不判断改动范围，作业照跑（作业的 if 按事件名放行）。
  merge_group:
    types: [checks_requested]
    branches: [main]

# 同一个 PR 又推了新提交，旧的整个取消，排上的模拟器构建也不许再起（build 的条件用 !cancelled()）。
# 队列里的 ref 一律是 gh-merge-queue/main，按它分组会把几次入队挤进同一组，改用这次入队的合并提交。
concurrency:
  group: ios-${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 同 rust.yml：不留增量编译的缓存，调试信息只留行号。
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

permissions:
  contents: read

jobs:
  changes:
    name: 改动范围（ios）
    # 这次 PR 有没有改到下面这些路径，替代原来触发器的 paths 过滤。
    # 只在 PR 上判断：队列、定时和手动运行一律跑全套，作业的 if 里按事件名放行。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # 按 REST 接口列 PR 改动的文件，不用检出代码。
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      # MIT
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # 和 GitHub 自己的 paths 一样按文件判断：命中任意一条正向规则、且不命中任何 ! 排除项才算改到。
          predicate-quantifier: some-with-excludes
          filters: |
            changed:
              - "apps/ios/**"
              - "design/**"
              - "scripts/generate-design.py"
              - "crates/wonton-client/**"
              - "crates/wonton-l10n/**"
              - "crates/wonton-matrix/**"
              - "crates/wonton-protocol/**"
              - "crates/wonton-tunnel/**"
              - "Cargo.toml"
              - "vendor/**"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ios.yml"
              - "!**/*.md"
              - "!crates/**/tests/**"
              - "!crates/**/benches/**"
              - "!crates/**/tests.rs"
              - "!crates/**/*_tests.rs"

  swiftlint:
    name: SwiftLint（函数体 ≤ 100 行）
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.changed == 'true')) }}
    runs-on: macos-26
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: "0.65.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 安装 SwiftLint（版本和 sha256 固定）
        run: |
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/swiftlint"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: SwiftLint
        working-directory: apps/ios
        run: |
          swiftlint version
          swiftlint lint --strict --no-cache

  build:
    name: 模拟器构建
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.changed == 'true')) }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      XCODEGEN_VERSION: "2.46.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 用 Xcode 27.1（和开发机 mini 上的一致）
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: 安装 rust-toolchain.toml 指定的工具链和 iOS 模拟器 target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # macOS 的产物和 Linux 作业不通用，单独一个 key。
          shared-key: rust-ios
          save-if: github.ref == 'refs/heads/main'
      - name: 安装 XcodeGen（版本和 sha256 固定）
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/xcodegen"
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: 编译 Rust 核心并生成 Swift 绑定
        env:
          WONTON_IOS_TARGETS: aarch64-apple-ios-sim
        run: apps/ios/scripts/build-core.sh debug
      - name: 生成 Xcode 工程
        run: xcodegen generate --spec apps/ios/project.yml
      - name: 构建 App
        run: |
          xcodebuild -version
          xcodebuild build \
            -project apps/ios/Wonton.xcodeproj \
            -scheme Wonton \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
