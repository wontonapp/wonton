name: ios

# 自托管 runner（ADR-0012 的“CI”），都在 macOS 上：SwiftLint，和一次模拟器构建（只编译 Apple 芯片模拟器一个
# target，不签名、不跑模拟器）。
on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "design/**"
      - "scripts/generate-design.py"
      - "crates/wonton-client/**"
      - "crates/wonton-matrix/**"
      - "crates/wonton-protocol/**"
      - "crates/wonton-tunnel/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "design/**"
      - "scripts/generate-design.py"
      - "crates/wonton-client/**"
      - "crates/wonton-matrix/**"
      - "crates/wonton-protocol/**"
      - "crates/wonton-tunnel/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint（函数体 ≤ 100 行）
    # 不放 Linux：只有带 docker 标签的机器能接容器作业，它们被 Rust 作业占满时，这个几秒钟的作业要排半小时。
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 10
    env:
      SWIFTLINT_VERSION: "0.65.1"
    steps:
      - uses: actions/checkout@v5
      - name: 安装 SwiftLint（按版本放进 runner 的工具缓存，下次直接用）
        run: |
          dir="$RUNNER_TOOL_CACHE/swiftlint/$SWIFTLINT_VERSION"
          if [[ ! -x "$dir/swiftlint" ]]; then
            curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
              "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
            mkdir -p "$dir"
            unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$dir"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: SwiftLint
        working-directory: apps/ios
        run: |
          swiftlint version
          swiftlint lint --strict --no-cache

  build:
    name: 模拟器构建
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 30
    env:
      XCODEGEN_VERSION: "2.46.0"
      # 同 rust.yml：不留增量编译的缓存，调试信息只留行号。
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: 构建缓存目录（runner 主机上的共享目录，见 rust.yml）
        run: echo "CARGO_TARGET_DIR=${WONTON_CI_CACHE:-$RUNNER_WORKSPACE/../_cargo-target}/$RUNNER_NAME/ios" >> "$GITHUB_ENV"
      - name: 安装 rust-toolchain.toml 指定的工具链和 iOS 模拟器 target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - name: 安装 XcodeGen（按版本放进 runner 的工具缓存，下次直接用）
        run: |
          dir="$RUNNER_TOOL_CACHE/xcodegen/$XCODEGEN_VERSION"
          if [[ ! -x "$dir/xcodegen/bin/xcodegen" ]]; then
            curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
              "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
            mkdir -p "$dir"
            unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$dir"
          fi
          echo "$dir/xcodegen/bin" >> "$GITHUB_PATH"
      - name: 编译 Rust 核心并生成 Swift 绑定
        env:
          WONTON_IOS_TARGETS: aarch64-apple-ios-sim
        run: apps/ios/scripts/build-core.sh debug
      - name: 生成 Xcode 工程
        run: xcodegen generate --spec apps/ios/project.yml
      - name: 构建 App
        run: |
          xcodebuild -version
          xcodebuild build \
            -project apps/ios/Wonton.xcodeproj \
            -scheme Wonton \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
