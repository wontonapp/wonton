name: snapshots-record

# 截图参考图重录：只在给 PR 打 record-snapshots 标签时跑，和每个 PR 的日常作业（ios.yml、android.yml）分开。
# 打任何标签都会触发这个工作流（触发器只认事件类型），作业里再按标签名过滤；它不算必需检查。写权限只给重录
# 作业，日常作业保持只读。
on:
  pull_request:
    types: [labeled]

concurrency:
  group: snapshots-record-${{ github.event.pull_request.head.ref }}
  # 只有 record-snapshots 会取消正在跑的那轮（摘掉后再贴就是再要一次重录）。别的标签也会触发这个工作流、
  # 作业直接跳过，不跟着取消就把跑到一半的录制连同它的推送一起掐掉了。
  cancel-in-progress: ${{ github.event.label.name == 'record-snapshots' }}

permissions:
  contents: read

# 同 android.yml：不留增量编出的中间件，调试信息只留行号。
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  ios:
    name: 重录 iOS 截图
    if: github.event.label.name == 'record-snapshots'
    # macOS 托管机：和 ios.yml 一样要 Xcode 27.1 的镜像。
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      # 把录好的参考图推回 PR 分支。
      contents: write
      # 录完摘掉标签，不然之后每次推送都重录。
      pull-requests: write
      issues: write
    env:
      XCODEGEN_VERSION: "2.46.0"
      # 参考图绑定这台模拟器和这个系统版本：改了要整体重录。设备取装机列表里的普通 iPhone。
      SIMULATOR_NAME: iPhone 17
      SIMULATOR_OS: "27.0"
      # 日期按 UTC、en_US 排版，参考图才可复现。录制模式由 `WontonSnapshots` scheme 的环境变量打开：
      # xcodebuild 步骤的 env 传不进模拟器里跑的 App。
      TZ: UTC
    steps:
      # 重录要把参考图推到 PR 的分支，检出的是分支本身。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
      - name: 用 Xcode 27.1（和开发机 mini 上的一致）
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: 安装 rust-toolchain.toml 指定的工具链和 iOS 模拟器 target
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # PR 只恢复缓存，不写（缓存只在 main 上由 cache.yml 存）。
          shared-key: rust-ios
          save-if: false
      - name: 安装 XcodeGen（版本和 sha256 固定）
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/xcodegen"
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: 编译 Rust 核心并生成 Swift 绑定
        env:
          WONTON_IOS_TARGETS: aarch64-apple-ios-sim
        run: apps/ios/scripts/build-core.sh debug
      - name: 生成 Xcode 工程
        run: xcodegen generate --spec apps/ios/project.yml
      - name: 构建测试
        run: |
          xcodebuild -version
          xcodebuild build-for-testing \
            -project apps/ios/Wonton.xcodeproj \
            -scheme WontonSnapshots \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=$SIMULATOR_OS" \
            -only-testing:WontonTests \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
      - name: 重录截图测试
        id: tests
        run: |
          xcodebuild test-without-building \
            -project apps/ios/Wonton.xcodeproj \
            -scheme WontonSnapshots \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=$SIMULATOR_OS" \
            -only-testing:WontonTests \
            -parallel-testing-enabled NO \
            -testLanguage en \
            -testRegion US \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 10 \
            -maximum-test-execution-time-allowance 60 \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
      # 令牌推的提交不会再触发工作流（GitHub 的规则），所以录完要在 PR 上推一个空提交或点重跑。
      # 只在本仓库的 PR 上提交；外部 fork 的令牌推不回对方的分支，参考图走下面的产物，标签由后面的步骤摘。
      - name: 提交参考图
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p apps/ios/WontonTests/__Snapshots__
          git add -A apps/ios/WontonTests/__Snapshots__
          if git diff --cached --quiet; then
            echo "参考图没有变化，不提交。"
          else
            git commit -m "test(ios): 录制截图测试参考图"
            # android 作业同时也在往这条分支推：先取分支头，把这次提交变基上去再推，推不动就重试。
            # 两边的参考图路径不相交，变基本身不会冲突。
            ok=false
            for attempt in 1 2 3; do
              if git fetch origin "$BRANCH" && git rebase "origin/$BRANCH" \
                 && git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"; then
                ok=true
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            $ok || { echo "推送失败" >&2; exit 1; }
          fi
      # 外部 fork 推不回去，录好的图由作者从产物里取。
      - name: 外部 PR：把参考图存成产物
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-snapshots
          path: apps/ios/WontonTests/__Snapshots__
          retention-days: 7
          if-no-files-found: ignore
      # 外部 fork 的令牌够得着 PR，标签照样摘；不摘的话以后每次打标签都会再录。
      - name: 摘掉标签
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/labels/record-snapshots" \
            || echo "标签已经不在了。"
      # 录制模式下每个用例都会报“已录制”，失败结果包里有每张新图和旧图。
      - name: 失败时存测试结果包
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-record-failure
          path: ${{ runner.temp }}/Tests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: 重录 Android 参考图
    if: github.event.label.name == 'record-snapshots'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # 把重录的参考图推回 PR 的分支，推完摘掉标签。
      contents: write
      pull-requests: write
    steps:
      # 检出分支本身而不是默认的合并提交：推回去的分支头才不带 base 的合并提交。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: 安装 rust-toolchain.toml 指定的工具链和 Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-ndk@4.1.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 和 android.yml 同一个 key，恢复它编好的依赖。标签运行不写缓存。
          shared-key: rust-android
          save-if: false
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: 重录界面参考图
        working-directory: apps/compose
        run: ./gradlew :shared:recordPaparazziAndroidMain
      - name: 差异图和报告
        # 失败时给差异图；外部 PR 推不回去，录好的图也只在这里拿得到。
        if: ${{ failure() || github.event.pull_request.head.repo.full_name != github.repository }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paparazzi-${{ github.run_attempt }}
          path: |
            apps/compose/shared/build/paparazzi
            apps/compose/shared/build/reports/paparazzi
            apps/compose/shared/src/androidHostTest/snapshots
          retention-days: 7
          if-no-files-found: ignore
      - name: 提交重录的参考图
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/compose/shared/src/androidHostTest/snapshots
          if git diff --cached --quiet; then
            echo "参考图没有变化" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "test(android): 重录界面参考图"
          # ios 作业同时也在往这条分支推：先取分支头，把这次提交变基上去再推，推不动就重试。
          # 两边的参考图路径不相交，变基本身不会冲突。通过请求头带令牌，不把令牌拼进 remote 地址。
          ok=false
          for attempt in 1 2 3; do
            if git fetch origin "${GITHUB_HEAD_REF}" && git rebase "origin/${GITHUB_HEAD_REF}" \
               && git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
                    push origin "HEAD:${GITHUB_HEAD_REF}"; then
              ok=true
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          $ok || { echo "推送失败" >&2; exit 1; }
          echo "已提交重录的参考图。这个提交由 GITHUB_TOKEN 推上去，不再触发 CI：请点重跑或推一个空提交让参考图过一遍比对。" >> "$GITHUB_STEP_SUMMARY"
      # 标签必须摘掉：GitHub 不会给已经贴着的标签再发一次 labeled，留着就发不出下一轮重录。单独一步、
      # 只看标签（外部 PR 的分支推不回去也照摘），不跟着提交步骤的成败走。
      - name: 去掉 record-snapshots 标签
        if: ${{ always() && github.event.label.name == 'record-snapshots' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --remove-label record-snapshots \
            || echo "标签已经不在了。"
