name: ops-chmod-mini-slot
on:
  push:
    branches: [ops/chmod-mini-slot]
  workflow_dispatch:
jobs:
  who:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - run: |
          id; echo "HOME=$HOME"
          ls -ld /Users/* 2>&1 | head -20
          dscl . -list /Users NFSHomeDirectory 2>/dev/null | grep -i jiale
