name: ops-chmod-mini-slot
on:
  push:
    branches: [ops/chmod-mini-slot]
  workflow_dispatch:
jobs:
  who:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - run: |
          hostname; scutil --get ComputerName 2>/dev/null; sysctl -n hw.model
          ls /Users 2>&1 | head
          ls -ld /Users/jiale 2>&1
          ls -l /Users/jiale/wonton-dev/mini-slot.sh 2>&1
