# 临时：修 mini 上被 644 落盘的 mini-slot.sh（2026-11-28 部署时 tee 丢了执行位，受限 ssh 入口 exec 不了它）。
# 走自带的 self-hosted runner 在 mini 本机上跑，不需要 ssh 进去。修好后这个文件可以删。
# runner 用的账户是 runner（$HOME=/Users/runner），走动查用的还是 jiale 那份，这里按绝对路径改。
name: ops-chmod-mini-slot
on:
  push:
    branches: [ops/chmod-mini-slot]
  workflow_dispatch:
jobs:
  chmod:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - name: 执行位
        run: |
          chmod 755 /Users/jiale/wonton-dev/mini-slot.sh
          ls -l /Users/jiale/wonton-dev/mini-slot.sh /Users/runner/wonton-dev/mini-slot.sh
          md5 /Users/jiale/wonton-dev/mini-slot.sh /Users/runner/wonton-dev/mini-slot.sh
      - name: 能跑
        run: bash /Users/jiale/wonton-dev/mini-slot.sh status
