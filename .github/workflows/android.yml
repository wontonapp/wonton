name: android

on:
  pull_request:
    paths:
      - "apps/compose/**"
      - "crates/wonton-client/**"
      - "crates/wonton-protocol/**"
      - "crates/wonton-tunnel/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/compose/**"
      - "crates/wonton-client/**"
      - "crates/wonton-protocol/**"
      - "crates/wonton-tunnel/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: detekt 与 Debug 构建
    # 自托管 runner（ADR-0012 的“CI”）：Android SDK 和 NDK 预装在 runner 主机上，由 runner 的环境给出 ANDROID_HOME。
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      CARGO_NDK_VERSION: "4.1.2"
      # 同 ci.yml：不留增量编译的缓存，调试信息只留行号。
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: 构建缓存目录（runner 主机上的共享目录，见 ci.yml）
        run: echo "CARGO_TARGET_DIR=${WONTON_CI_CACHE:-$RUNNER_WORKSPACE/../_cargo-target}/android" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: 安装 rust-toolchain.toml 指定的工具链和 Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
      - uses: gradle/actions/setup-gradle@v5
        with:
          # runner 主机的 ~/.gradle 跨次运行保留，不经 GitHub 的缓存服务上传下载。
          cache-disabled: true
      - name: detekt（函数 ≤ 100 行）与 Debug APK
        working-directory: apps/compose
        run: ./gradlew detekt :androidApp:assembleDebug
