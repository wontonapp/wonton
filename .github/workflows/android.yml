name: android

on:
  pull_request:
    paths:
      - "apps/compose/**"
      - "crates/wonton-client/**"
      - "crates/wonton-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/compose/**"
      - "crates/wonton-client/**"
      - "crates/wonton-protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: detekt 与 Debug 构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NDK_VERSION: "4.1.2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: 安装 rust-toolchain.toml 指定的工具链和 Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
      - uses: gradle/actions/setup-gradle@v5
      - name: detekt（函数 ≤ 100 行）与 Debug APK
        working-directory: apps/compose
        run: ./gradlew detekt :androidApp:assembleDebug
