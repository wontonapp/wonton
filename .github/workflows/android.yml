name: android

on:
  pull_request:
    paths:
      - "apps/compose/**"
      - "apps/ios/Wonton/Assets.xcassets/**"
      - "apps/ios/Wonton/Design/Generated/**"
      - "design/**"
      - "scripts/generate-design.py"
      - "crates/wonton-client/**"
      - "crates/wonton-matrix/**"
      - "crates/wonton-protocol/**"
      - "crates/wonton-tunnel/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/compose/**"
      - "apps/ios/Wonton/Assets.xcassets/**"
      - "apps/ios/Wonton/Design/Generated/**"
      - "design/**"
      - "scripts/generate-design.py"
      - "crates/wonton-client/**"
      - "crates/wonton-matrix/**"
      - "crates/wonton-protocol/**"
      - "crates/wonton-tunnel/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: detekt、单元测试与 Debug 构建
    # 自托管 runner（ADR-0012 的“CI”）：Android SDK 和 NDK 预装在 runner 主机上，由 runner 的环境给出 ANDROID_HOME。
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      CARGO_NDK_VERSION: "4.1.2"
      # 同 rust.yml：不留增量编译的缓存，调试信息只留行号。
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: 构建缓存目录（runner 主机上的共享目录，见 rust.yml）
        # Gradle 也按 runner 分开：共用 ~/.gradle 时，并行的作业抢 build-cache-1.lock，构建偶发失败（2026-11-04，#261）。
        run: |
          cache="${WONTON_CI_CACHE:-$RUNNER_WORKSPACE/../_cargo-target}/$RUNNER_NAME"
          echo "CARGO_TARGET_DIR=$cache/android" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$cache/gradle" >> "$GITHUB_ENV"
          # Gradle 和 wrapper 不读 https_proxy，要写成 systemProp。没配时 wrapper 直连下载，1k 上实测 58 KB/s，
          # 170 MB 的发行包下不完，作业到 30 分钟超时（2026-11-04，#308）。
          if [ -n "${https_proxy:-}" ]; then
            address="${https_proxy#*://}"
            address="${address%/}"
            mkdir -p "$cache/gradle"
            {
              for scheme in http https; do
                echo "systemProp.$scheme.proxyHost=${address%:*}"
                echo "systemProp.$scheme.proxyPort=${address##*:}"
              done
              echo 'systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.localhost|*.local'
            } > "$cache/gradle/gradle.properties"
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: 安装 rust-toolchain.toml 指定的工具链和 Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - name: 安装 cargo-ndk
        # 同一台主机上的几个 runner 共用 ~/.cargo。版本对了就不装：不是 cargo install 装进来的同版本二进制，
        # cargo install 会报 already exists 失败（titan 实测）。要装时加锁，免得升级版本时几个作业同时写同一处；
        # 等到锁时别的作业已经装好，cargo install 认得出已装的同版本，直接成功。
        run: |
          if [ "$(cargo ndk --version 2>/dev/null)" = "cargo-ndk $CARGO_NDK_VERSION" ]; then exit 0; fi
          flock "${CARGO_HOME:-$HOME/.cargo}/.cargo-ndk-install.lock" \
            cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
      - name: 设计生成结果和 design/ 一致
        run: python3 scripts/generate-design.py --check
      - uses: gradle/actions/setup-gradle@v5
        with:
          # GRADLE_USER_HOME 在 runner 主机上跨次运行保留，不经 GitHub 的缓存服务上传下载。
          cache-disabled: true
      - name: detekt（函数 ≤ 100 行）、单元测试与 Debug APK
        working-directory: apps/compose
        run: ./gradlew detekt :androidApp:testDebugUnitTest :androidApp:assembleDebug
