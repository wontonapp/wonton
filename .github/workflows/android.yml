name: android

# detekt、单元测试、Debug 构建和界面参考图比对。PR 上由 gate.yml 按改动范围调用（合并门槛，范围写在那边的
# changes 里），不自己挂 pull_request；每天定时、手动触发时自己跑全量。
on:
  workflow_call:
  schedule:
    # 每天全量兜底：main 上不重跑，两个各自绿的 PR 合在一起才出的错由这次发现。
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

permissions:
  contents: read

jobs:
  build:
    name: detekt、单元测试与 Debug 构建
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: 安装 rust-toolchain.toml 指定的工具链和 Android target
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-ndk@4.1.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 只读：同一份 key 由 cache.yml 的 Android 作业在 push 时编好写回。这里也写的话，
          # 一次 main 合并会编两遍、两条运行抢着写同一个 key。
          shared-key: rust-android
          save-if: false
      - name: 设计生成结果和 design/ 一致
        run: python3 scripts/generate-design.py --check
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: detekt（函数 ≤ 100 行）、单元测试与 Debug APK
        working-directory: apps/compose
        run: ./gradlew detekt :androidApp:testDebugUnitTest :androidApp:assembleDebug
      # 界面参考图：预览用固定假数据，在 JVM 上渲染，不加载 .so。重录在 snapshots-record.yml，这里只比对。
      - name: 比对界面参考图
        working-directory: apps/compose
        run: ./gradlew :shared:verifyPaparazziAndroidMain
      - name: 差异图和报告
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paparazzi-${{ github.run_attempt }}
          path: |
            apps/compose/shared/build/paparazzi
            apps/compose/shared/build/reports/paparazzi
          retention-days: 7
          if-no-files-found: ignore
      # 只编不跑：设备上的测试要在设备上加载原生核心、还要模拟器，日常 PR 上太重；编译能挡住 API 和清单错误。
      - name: 编译设备测试（androidTest）
        working-directory: apps/compose
        run: ./gradlew :androidApp:assembleDebugAndroidTest
