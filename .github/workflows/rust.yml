name: rust

# 排队最久的是 Docker 集成测试，只能在 npchy 上跑，所以 PR 只在改到 Rust 或测试读的文件时才跑：测试会读 deploy/ 和
# plugins/ 里的文件。没有分支保护，跳过的检查不挡合并。main 上每次合并都跑，文档除外。
on:
  pull_request:
    paths:
      - "crates/**"
      - "deploy/**"
      - "plugins/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

# 同一个 PR 又推了新提交，旧的运行就取消，别占着 runner；main 上的每次合并都跑完。
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 作业都跑在主人的自托管 runner 上（ADR-0012 的“CI”）。检出会清掉工作区里没被跟踪的文件，Rust 的构建缓存放在
# runner 主机的共享目录（`WONTON_CI_CACHE`），同一台机器上的几个 runner 共用、跨次沿用。
env:
  # CI 不需要增量编译的缓存，调试信息只留行号：构建缓存小一半以上。
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 构建缓存目录
        # 按 runner 分开：同一台主机上的几个 runner 共用 WONTON_CI_CACHE，同时跑的作业共用一个 target 目录时，
        # 实测出现过测试编进了另一个分支的代码（2026-11-03，#139 编出了 file-client 分支的 wonton-protocol）。
        run: echo "CARGO_TARGET_DIR=${WONTON_CI_CACHE:-$RUNNER_WORKSPACE/../_cargo-target}/$RUNNER_NAME/workspace" >> "$GITHUB_ENV"
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - name: 格式
        run: cargo fmt --all --check
      - name: Clippy（含函数不超过 100 行）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 测试（不含依赖 Docker 的集成测试）
        run: cargo test --workspace --locked
        env:
          # 故意让 Docker 不可用，保证默认的测试不依赖它：依赖 Docker 的测试标了 #[ignore]，由下面的作业运行。
          DOCKER_HOST: unix:///nonexistent/docker.sock

  docker-tests:
    name: Docker 集成测试
    runs-on: [self-hosted, Linux, X64, docker]
    # 起容器、拉镜像最容易卡住，不要占满默认的 6 小时。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 构建缓存目录（和 Rust 作业分开，两者能同时编译）
        run: echo "CARGO_TARGET_DIR=${WONTON_CI_CACHE:-$RUNNER_WORKSPACE/../_cargo-target}/$RUNNER_NAME/docker" >> "$GITHUB_ENV"
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - name: 确认 Docker 可用
        run: docker version
      - name: 依赖 Docker 的集成测试（标了 #[ignore] 的都是）
        run: cargo test --workspace --locked -- --ignored
