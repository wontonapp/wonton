name: rust

# 排队最久的是这个工作流，所以 PR 只在改到 Rust 或测试读的文件时才跑：测试会读 deploy/ 和 plugins/ 里的文件。没有分支
# 保护，跳过的检查不挡合并。main 上每次合并都跑，文档除外。
on:
  pull_request:
    paths:
      - "crates/**"
      - "deploy/**"
      - "plugins/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
      - "scripts/clean-docker-test-leftovers.sh"
      - "scripts/ci-capture-container-logs.sh"
      - "scripts/ci-note-sigterm.sh"
      - "!**/*.md"
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

# 同一个 PR 又推了新提交，旧的运行就取消，别占着 runner；main 上的每次合并都跑完。
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 作业都跑在主人的自托管 runner 上（ADR-0012 的“CI”）。检出会清掉工作区里没被跟踪的文件，Rust 的构建缓存放在
# runner 主机的共享目录（`WONTON_CI_CACHE`），同一台机器上的几个 runner 共用、跨次沿用。
env:
  # CI 不需要增量编译的缓存，调试信息只留行号：构建缓存小一半以上。
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # 分成两个作业：格式、Clippy 和默认测试不碰 Docker，跑在带 rust 标签的机器上；Docker 集成测试只能在带 docker 标签的
  # 几台上跑。合在一起时每个 PR 都要排那几台，一排七八个（2026-11-06）。分开后两个作业同时跑，Docker 那个要在另一个
  # target 目录里再编译、链接一遍测试二进制，但 PR 等的总时间不变长。
  rust:
    name: Rust
    # 不用任意 Linux runner：带 docker 标签的那台主机同时跑 omp 编译和验证栈，常年满载，Rust 作业落上去会慢到超时。
    # 只写 rust：只给 Rust 作业用的机器注册时去掉了默认标签（--no-default-labels），不会接到 Android 这类要别的环境的作业。
    runs-on: [rust]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: 构建缓存目录
        # 按 runner 分开：同一台主机上的几个 runner 共用 WONTON_CI_CACHE，同时跑的作业共用一个 target 目录时，
        # 实测出现过测试编进了另一个分支的代码（2026-11-03，#139 编出了 file-client 分支的 wonton-protocol）。
        run: echo "CARGO_TARGET_DIR=${WONTON_CI_CACHE:-$RUNNER_WORKSPACE/../_cargo-target}/$RUNNER_NAME/rust" >> "$GITHUB_ENV"
      - name: 构建缓存超过 30 GB 就清掉
        # Cargo 不回收旧产物，target 目录会一直长。不用 cargo clean：target 目录是挪到别的盘的符号链接时，它只删链接（实测），
        # 数据留在原处，下次还编译到链接原来的位置。
        run: |
          if [ -d "$CARGO_TARGET_DIR" ] && [ "$(du -sm "$CARGO_TARGET_DIR/" | cut -f1)" -gt 30720 ]; then
            rm -rf "$CARGO_TARGET_DIR/debug"
          fi
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - name: 格式
        run: cargo fmt --all --check
      - name: 安装脚本（假 docker，不用真的 Docker）
        run: python3 -m unittest discover -q -s scripts/install -t scripts
      - name: Clippy（含函数不超过 100 行）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 测试（不含依赖 Docker 的集成测试）
        # 完整输出另存一份：失败时作为 artifact 上传，重跑覆盖不了失败那次的日志。
        # shell: bash 带 pipefail：默认的 shell 不带，经过 tee 测试失败也会算成功。
        shell: bash
        run: bash scripts/ci-note-sigterm.sh cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/test-output.log"
        env:
          # 故意让 Docker 不可用，保证默认的测试不依赖它：依赖 Docker 的测试标了 #[ignore]，由“Rust Docker 测试”运行。
          DOCKER_HOST: unix:///nonexistent/docker.sock
      - name: 失败时留下测试输出
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # 名字带上第几次运行：重跑另存一份，不覆盖失败那次。
          name: rust-test-output-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-output.log
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Rust Docker 测试
    # docker-test：能跑这些测试的机器（Docker 可用、deploy/ci/docker-test-images.txt 里的镜像由 npchy 推过去）。和发布用的 docker 标签分开，
    # 194 这类只跑测试、拉不到 Docker Hub 的机器不会接到发布作业。
    runs-on: [docker-test]
    # 起容器、拉镜像最容易卡住，不要占满默认的 6 小时。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # 下面三步同“Rust”作业。
      - name: 构建缓存目录
        run: echo "CARGO_TARGET_DIR=${WONTON_CI_CACHE:-$RUNNER_WORKSPACE/../_cargo-target}/$RUNNER_NAME/rust" >> "$GITHUB_ENV"
      - name: 构建缓存超过 30 GB 就清掉
        run: |
          if [ -d "$CARGO_TARGET_DIR" ] && [ "$(du -sm "$CARGO_TARGET_DIR/" | cut -f1)" -gt 30720 ]; then
            rm -rf "$CARGO_TARGET_DIR/debug"
          fi
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - name: 确认 Docker 可用
        run: docker version
      - name: 清理被中断的 Docker 测试遗留
        run: bash scripts/clean-docker-test-leftovers.sh
      - name: 记下测试起的容器的日志
        # 测试结束时容器会被删掉；失败时上传这些日志，才看得到 tuwunel、核心当时说了什么。只记本作业起的（见脚本）。
        run: |
          mkdir -p "$RUNNER_TEMP/test-logs/containers"
          nohup bash scripts/ci-capture-container-logs.sh "$RUNNER_TEMP/test-logs/containers" "$PPID" >/dev/null 2>&1 &
      - name: Docker 集成测试（标了 #[ignore] 的都是）
        shell: bash
        # 这个作业的 runner 都是 containerd 镜像存储：只在那时复现得了 #666 的测试不许静默跳过。
        run: bash scripts/ci-note-sigterm.sh cargo test --workspace --locked -- --ignored 2>&1 | tee "$RUNNER_TEMP/test-logs/test-output.log"
        env:
          WONTON_TEST_REQUIRE_CONTAINERD: "1"
      - name: 官方索引里的清单这份核心都读得懂
        run: |
          # 自建 runner 经宿主的出口代理取 raw.githubusercontent；代理偶尔卡住时 curl 默认连 300 秒才放弃（2026-11-07 194-1 上 #711 因此被取消），
          # 所以限死连接和总时长，卡住就快速重试。
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$RUNNER_TEMP/index.json" https://raw.githubusercontent.com/geraldpeng6/wonton-store/main/index.json
          cargo run -q -p wonton-core --locked -- plugin check-index "$RUNNER_TEMP/index.json"
      - name: 失败时留下测试输出和容器日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-docker-test-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-logs
          retention-days: 14
          if-no-files-found: ignore
