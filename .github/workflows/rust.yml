name: rust

# PR 只在改到 Rust 或测试读的文件时才跑：测试会读 deploy/ 和 plugins/ 里的文件。
# 草稿 PR 上一个作业都不起（含改动范围）：转 ready、每天的定时才跑，汇总作业在草稿上起来报一个通过。
# 路径不写在触发器上：必需检查在每个 PR 上都要有结果，工作流没触发的话检查一直“等待中”，PR 合不了。
# 改成由 changes 作业判断改动范围，没改到时自己报 skipped（跳过的检查算通过）。
# 必需检查只有末尾的汇总作业，其余作业在作业级直接跳过，不用为了报检查先起 runner；
# 测试分片被跳过时检查名会留成带 ${{ matrix.shard }} 的字面量，规则集只看汇总，不受影响。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 每天全量兜底：main 上不重跑，两个各自绿的 PR 合在一起才出的错由这次发现。
    - cron: "0 3 * * *"
  workflow_dispatch:

# 同一个 PR 又推了新提交，旧的运行就取消，别占着 runner；定时运行都跑完。
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI 不需要增量编译的缓存，调试信息只留行号：构建缓存小一半以上。
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

permissions:
  contents: read

# 缓存只在 main 上存，PR 恢复不写：PR 各自的分支都会写满 10 GB 的 actions 缓存。main 上的条目不靠这个
# 工作流（main 上只有 push，这里不跑），由 cache.yml 在 push 到 main 时用同样的 key 编一遍存下来。
# 同一族作业用同一个 shared-key：三个测试分片编的是同一套测试二进制，谁先存都一样。
jobs:
  changes:
    name: 改动范围（rust）
    # PR 用 REST 列改动文件，不用检出代码；定时和手动运行全量，草稿 PR 跳过。
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # 按 REST 接口列 PR 改动的文件，不用检出代码。
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      # MIT
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # 和 GitHub 自己的 paths 一样按文件判断：命中任意一条正向规则、且不命中任何 ! 排除项才算改到。
          predicate-quantifier: some-with-excludes
          filters: |
            changed:
              - "crates/**"
              # 测试和预热读的部署文件（include_str! 和 Dockerfile）；deploy/dev 其余的只给本机开发栈，改了不用跑。
              # 新的 include_str! 指向 deploy/ 时要补在这里。
              - "deploy/install/**"
              - "deploy/dev/acp-bridge/**"
              - "deploy/dev/core/compose.yaml"
              - "deploy/dev/core/Dockerfile"
              - "deploy/dev/matrix/**"
              - "plugins/**"
              # 镜像清单检查（wonton-core 的 test_docker_check）要运行它。
              - "scripts/mirror-test-images.sh"
              - "Cargo.toml"
              - "vendor/**"
              - "Cargo.lock"
              - "clippy.toml"
              - ".config/nextest.toml"
              - "rust-toolchain.toml"
              - ".github/workflows/rust.yml"
              - "!**/*.md"

  format:
    name: 格式
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.changed == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - name: 格式
        run: cargo fmt --all --check

  clippy:
    name: Clippy（含函数不超过 100 行）
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.changed == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust-clippy
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Clippy（含函数不超过 100 行）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 假数据入口（src/client/ui_fake.rs）在 cargo feature 后面，默认的 workspace 构建编不到它，门禁得单独开一遍。
      - name: Clippy 假数据入口（feature ui-fake）
        run: cargo clippy -p wonton-client --all-targets --locked --features ui-fake -- -D warnings

  test:
    name: 测试（不含依赖 Docker 的集成测试）${{ matrix.shard }}/4
    needs: changes
    # !cancelled() 让 changes 在定时、手动运行里跳过时，下游仍能全量运行；取消后不再起重作业。
    # 草稿和路径的判断在作业上：被跳过时 matrix 不展开、检查名留成字面量，规则集只看汇总就不受影响。
    if: ${{ !cancelled() && (needs.changes.outputs.changed == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 编译是每片都要做一遍的固定成本（缓存里的依赖之外那 12 个工作区 crate，4 核上约 250 秒），
        # 分片只缩短跑测试的那一段（三片时 62/80/114 秒）。多一片把最慢那片的跑测试减掉约四分之一。
        shard: [1, 2, 3, 4]
    env:
      # 故意让 Docker 不可用，保证默认的测试不依赖它：依赖 Docker 的测试标了 #[ignore]，由“Rust Docker 测试”运行。
      DOCKER_HOST: unix:///nonexistent/docker.sock
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: 测试（按名字的哈希分四片并行）
        shell: bash
        # 完整输出另存一份：失败时作为 artifact 上传，重跑覆盖不了失败那次的日志。
        run: cargo nextest run --workspace --locked --partition hash:${{ matrix.shard }}/4 2>&1 | tee "$RUNNER_TEMP/test-output.log"
      - name: 文档测试（nextest 不跑 doctest，分不了片，只在第一片跑）
        if: matrix.shard == 1
        shell: bash
        # 接在上一条的日志后面：失败时一起进 artifact。
        run: cargo test --doc --workspace --locked 2>&1 | tee -a "$RUNNER_TEMP/test-output.log"
        env:
          DOCKER_HOST: unix:///nonexistent/docker.sock
      - name: 失败时留下测试输出
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # 名字带上第几次运行：重跑另存一份，不覆盖失败那次。
          name: rust-test-output-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-output.log
          retention-days: 7
          if-no-files-found: ignore

  extras:
    name: 假数据入口的测试、官方索引检查
    # 两件都不分片、都要另编一遍工作区的 crate，单独一个作业和分片并行：放进哪一片都成最慢的那片
    # （11-12 实测：假数据入口 4 核上 185～209 s，索引检查 73～90 s，分片本身 6～7 分钟）。
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.changed == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_HOST: unix:///nonexistent/docker.sock
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 安装 rust-toolchain.toml 指定的工具链
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest@0.9.151
      # 和测试分片同一份依赖缓存（只读）：依赖的 feature 不变，只有工作区的 crate 要编。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust-test
          save-if: false
      # 先编不带 feature 的：和缓存里的依赖同一套特性，只编工作区的 crate；带 ui-fake 的放后面，只多编 wonton-client。
      - name: 官方索引里的清单这份核心都读得懂、渲染得出来
        # 每个插件都按安装前的渲染走一遍（索引里只有文件的 sha256，被引用的文件用占位内容），
        # 核心不再注入的变量、改名的变量当场失败，免得合进来以后那些插件装不上。用不到 Docker。
        # 带 --workspace：按整个 workspace 合特性，和测试缓存里的依赖一致；写成 -p wonton-core 会按单个包重新合特性，依赖又编一遍。
        shell: bash
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/index.json" \
            https://raw.githubusercontent.com/geraldpeng6/wonton-store/main/index.json
          cargo build --workspace --locked --bin wonton-core
          target/debug/wonton-core plugin check-index "$RUNNER_TEMP/index.json"
      - name: 测试假数据入口（feature ui-fake）
        # 假数据入口的模块和测试都在 cargo feature 后面，默认的 workspace 测试跑不到。
        run: cargo nextest run -p wonton-client --lib --locked --features ui-fake ui_fake

  # 必需检查只有这一个：任一作业失败或被取消就红，成功和跳过算过。规则集按这个名字配，
  # 草稿 PR 上其余作业全被跳过时它也照样起来并报通过，不用为此先起别的 runner。
  summary:
    name: rust 汇总
    needs: [changes, format, clippy, test, extras]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: 各作业的结果
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
