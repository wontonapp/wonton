name: 构建并推送 GHCR 镜像
description: >-
  buildx 容器构建器、host 网络、代理透传、ghcr 登录和 OCI labels 的镜像构建推送。release.yml 的核心、
  桥镜像和 main-image.yml 的 :main 镜像共用，别在调用方复制这些步骤，构建器等写法只在这里改。
inputs:
  tags:
    description: 完整的镜像 tag 列表，逗号分隔
    required: true
  platforms:
    description: 构建的平台，如 linux/amd64
    required: true
  file:
    description: Dockerfile 路径，构建上下文是仓库根目录
    required: true
  version:
    description: 写进 org.opencontainers.image.version 的值
    required: true
  extra-build-args:
    description: 追加的 build-arg，一行一个。代理透传是固定的，不用写。
    required: false
    default: ""
  cache:
    description: >-
      用常驻构建器复用构建缓存（层缓存 + cargo 的缓存挂载），只给 main-image 传 true；release 不传，照旧每次
      新的构建器从头编，发版产物不带缓存状态。
    required: false
    default: "false"
  github-token:
    description: 推 ghcr.io 用的令牌。组合 action 读不到 secrets，只能从输入拿。
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # runner 环境里的代理监听在主机的回环地址上，构建步骤（cargo 下载依赖）用 host 网络才连得上。
    # 代理值在 runner 环境里，这里透传成 build-arg。
    - name: 构建参数
      id: meta
      shell: bash
      env:
        EXTRA_BUILD_ARGS: ${{ inputs.extra-build-args }}
      run: |
        {
          echo "build_args<<EOF"
          echo "http_proxy=${http_proxy:-}"
          echo "https_proxy=${https_proxy:-}"
          if [ -n "${EXTRA_BUILD_ARGS}" ]; then
            printf '%s\n' "${EXTRA_BUILD_ARGS}"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    # 容器里的构建器：Docker 自带的构建器用的是 Docker 的镜像存储，本机已有 amd64 的 debian:trixie-slim 时，构建 arm64
    # 也拿它当基础镜像（Docker 29.7.2、overlayfs 存储驱动上实测，镜像里的 arm64 程序找不到动态链接器）。每次都是新的
    # 构建器，层缓存和缓存挂载都从零开始，Rust 从头编译。构建器自己的镜像 moby/buildkit 要预先放在 runner 主机上：
    # 国内的主机连不上 Docker Hub（所以基础镜像也改从 ECR Public 拉，见核心的 Dockerfile）。
    - uses: docker/setup-buildx-action@v3
      if: inputs.cache != 'true'
      with:
        driver-opts: network=host
        buildkitd-flags: --allow-insecure-entitlement network.host
    # 常驻构建器（main-image 传 cache=true）：留在 runner 主机上，层缓存和 RUN --mount=type=cache（cargo registry、
    # target）都能复用，合并后只重编工作区的 crate。缓存就是构建器的状态卷 buildx_buildkit_<名>_state，buildkitd 的
    # gc 上限 10 GiB；整个删掉：docker buildx rm <名>。多台 runner 各有各的缓存，首次构建是冷的。
    # buildkitd 配置在 create 时写进构建器记录，改它要先在各 runner 上 docker buildx rm 旧构建器才生效。
    - name: 常驻构建器
      id: builder
      if: inputs.cache == 'true'
      shell: bash
      env:
        BUILDER: wonton-cache-${{ github.workflow }}
      run: |
        cat > "$RUNNER_TEMP/buildkitd.toml" <<'EOF'
        [worker.oci]
          gc = true
          gckeepstorage = 10737418240

          [[worker.oci.gcpolicy]]
            keepBytes = 10737418240
            all = true
        EOF
        docker buildx inspect "$BUILDER" >/dev/null 2>&1 || \
          docker buildx create --name "$BUILDER" --driver docker-container \
            --driver-opt network=host \
            --buildkitd-flags '--allow-insecure-entitlement network.host' \
            --buildkitd-config "$RUNNER_TEMP/buildkitd.toml"
        echo "name=$BUILDER" >> "$GITHUB_OUTPUT"
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        builder: ${{ steps.builder.outputs.name }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        network: host
        allow: network.host
        build-args: ${{ steps.meta.outputs.build_args }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
        tags: ${{ inputs.tags }}
        push: true
