name: 构建并推送 GHCR 镜像
description: >-
  buildx 构建、ghcr 登录和 OCI labels 的镜像构建推送。release.yml 的核心、桥镜像和 main-image.yml 的
  :main 镜像共用，别在调用方复制这些步骤，构建器等写法只在这里改。
inputs:
  tags:
    description: 完整的镜像 tag 列表，逗号分隔；push-by-digest 为 true 时不传
    required: false
    default: ""
  image:
    description: 镜像仓库（push-by-digest 为 true 时必填，digest 按它推）
    required: false
    default: ""
  platforms:
    description: 构建的平台；发版是单架构矩阵，每次只传一个
    required: true
  file:
    description: Dockerfile 路径，构建上下文是仓库根目录
    required: true
  version:
    description: 写进 org.opencontainers.image.version 的值
    required: true
  extra-build-args:
    description: 追加的 build-arg，一行一个
    required: false
    default: ""
  cache:
    description: 用 GitHub Actions 缓存（读层 + 写回），只给 main-image 传 true；release 只读缓存，发版产物不带新缓存状态
    required: false
    default: "false"
  push-by-digest:
    description: >-
      发版的单架构构建按 digest 推（多架构 manifest 最后由 merge-image-manifest 合成），传 true；输出 digest。
    required: false
    default: "false"
  github-token:
    description: 推 ghcr.io 用的令牌。组合 action 读不到 secrets，只能从输入拿。
    required: false
    default: ${{ github.token }}
outputs:
  digest:
    description: push-by-digest 为 true 时推上去的镜像 digest
    value: ${{ steps.push.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      id: push
      with:
        context: .
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        # digest 模式不带 tag：镜像名和 push 都在 outputs 里说（build-push-action 没有直接接收
        # push-by-digest 的输入，官方多平台构建的写法就是这样）。
        outputs: ${{ inputs.push-by-digest == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', inputs.image) || '' }}
        push: ${{ inputs.push-by-digest == 'true' && 'false' || 'true' }}
        tags: ${{ inputs.push-by-digest == 'true' && '' || inputs.tags }}
        build-args: ${{ inputs.extra-build-args }}
        # 层缓存经 GitHub Actions 缓存导出；Dockerfile 的依赖在 cargo-chef 依赖层里，改源码不用重编依赖。
        cache-from: type=gha
        cache-to: ${{ inputs.cache == 'true' && 'type=gha,mode=max' || '' }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
