[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose-multiplatform = "1.12.2"
compose-material3 = "1.9.0"
detekt = "2.0.0-alpha.6"
jna = "5.19.1"
kotlinx-coroutines = "1.11.0"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-biometric = "1.1.0"
androidx-core = "1.18.0"
androidx-webkit = "1.18.0"
androidx-browser = "1.9.0"
androidx-window = "1.5.1"
androidx-adaptive = "1.3.0"
unifiedpush-connector = "3.3.5"
androidx-camera = "1.6.2"
androidx-media3 = "1.11.1"
zxing = "3.5.4"
glance = "1.2.0"
junit = "4.13.2"
robolectric = "4.17"
androidx-test-junit = "1.3.0"
androidx-test-rules = "1.7.0"
androidx-test-runner = "1.7.0"
paparazzi = "2.0.0-alpha05.1"
compose-ui-test-manifest = "1.12.0-beta01"
android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "36"

[libraries]
# MIT OR Apache-2.0。Rust 核心校验 HTTPS 证书时经 JNI 调的 Android 组件。不写版本：androidApp 从 Cargo.lock 读。
rustls-platform-verifier = { module = "org.rustls:rustls-platform-verifier" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
# Apache-2.0。看恢复密钥前先过系统验证（指纹、面容或锁屏密码）。
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
# Apache-2.0。外部链接用 Custom Tabs 打开，不换 App。
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
# Apache-2.0。窗口尺寸类及宽屏两栏原生布局。
androidx-window-core = { module = "androidx.window:window-core", version.ref = "androidx-window" }
androidx-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "androidx-adaptive" }
androidx-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "androidx-adaptive" }
androidx-adaptive-navigation = { module = "androidx.compose.material3.adaptive:adaptive-navigation", version.ref = "androidx-adaptive" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "androidx-media3" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush-connector" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidx-camera" }
# Apache-2.0。Bot 状态头像的静音循环播放（ExoPlayer）和主人选取的视频转码（Transformer、CropEffect）。
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidx-media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "androidx-media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "androidx-media3" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# Apache-2.0。桌面小组件（ADR-0100）：用 Compose 的写法出 RemoteViews。
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
# EPL-1.0。单元测试的断言和 runner。
junit = { module = "junit:junit", version.ref = "junit" }
# MIT。JVM 上跑 Android 界面测试。
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# Apache-2.0。Robolectric 的 AndroidJUnit4 runner。
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
# Apache-2.0。仪器测试的权限规则：先发通知和相机权限，免得系统弹窗把被测 Activity 顶掉。
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
# Apache-2.0。createComposeRule 和语义树断言；版本跟 compose-multiplatform 走。
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose-multiplatform" }
# Apache-2.0。测试用的 ComponentActivity 声明。
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose-ui-test-manifest" }
# Apache-2.0。@Preview 注解，界面预览和截图测试只看它标注的函数。
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
# Apache-2.0。设备上跑 androidTest 的 runner。
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
# Apache-2.0。在 JVM 上按布局渲染界面并比对参考图。
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
