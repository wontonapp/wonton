org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# Rust 客户端核心的构建参数，可用 -P 覆盖：
#   wonton.abis        要编译的 ABI，空格分隔，如 "arm64-v8a x86_64"；x86_64 给 JVM 单测（Robolectric）用
#   wonton.rustProfile debug 或 release；不设时 Release 变体的任务（assembleRelease 等）用 release，其余用 debug
#   wonton.uiFake      假数据入口（ui-fake feature）：auto=Debug 带 Release 不带，1/0 强制
wonton.abis=arm64-v8a x86_64
wonton.rustProfile=
wonton.uiFake=auto
