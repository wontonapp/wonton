org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official

# Rust 客户端核心构建参数；命令行用 -P 覆盖：
#   wonton.abis        要编译的 ABI，空格分隔，如 "arm64-v8a x86_64"
#   wonton.rustProfile debug 或 release
#   wonton.uiFake      假数据入口（ui-fake feature）：auto=Debug 带 Release 不带，1/0 强制
wonton.abis=arm64-v8a
wonton.rustProfile=debug
wonton.uiFake=auto
