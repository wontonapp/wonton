# 函数体 ≤ 100 行，超出即 error。文件行数只由 scripts/check-file-size.sh 管：SwiftLint 不读 .size-allowlist，写进例外的文件它照样报错。
# CI 用 --strict 运行，其余规则的 warning 也会失败。
included:
  - Wonton
  - WontonClient/Package.swift
  - WontonClient/Sources

excluded:
  - WontonClient/Sources/WontonClient/Generated
  - Wonton/Design/Generated

disabled_rules:
  - file_length

function_body_length:
  warning: 100
  error: 100

# 每个枚举值一个分支的平铺 switch（时间线的增量、分类名、失败后的下一步）拆开反而难读，case 不计入圈复杂度。
cyclomatic_complexity:
  ignores_case_statements: true
