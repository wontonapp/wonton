# XcodeGen 工程描述。Wonton.xcodeproj 由它生成，不提交：xcodegen generate --spec apps/ios/project.yml
name: Wonton
options:
  bundleIdPrefix: app.wonton
  # 资源的基础语言，系统语言不在支持范围里时用它（ADR-0043）。
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # 测试动作关掉线程性能检查（Thread Performance Checker）。主线程同步调进核心时偶尔要等 tokio 工作线程放开锁，它把这记成
  # 优先级反转，在被卡住的主线程上逐帧符号化、打印整个调用栈；CI 上一帧约一秒，一次能拖过单测的 60 秒时限，用例被判超时。
  # XcodeGen 只给运行动作生成这个开关；test plan 里的同名选项在 Xcode 27.1 实测不生效，用了 test plan 以后 scheme 上的
  # 开关也不认，所以生成完往 scheme 的测试动作上补。
  postGenCommand: sed -i '' 's/<TestAction/<TestAction disablePerformanceAntipatternChecker = "YES"/' Wonton.xcodeproj/xcshareddata/xcschemes/*.xcscheme
# 两个配置共用 build-core.sh 写出的版本号（见其脚本内注释）；文件不进 git。
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # App 的 bundle ID；分享扩展是 `<它>.share`，App Group 是 `group.<它>`（ADR-0097）。真机用自己的团队签名时只改这一个，
    # 三个标识跟着变（见 README）；直接改 PRODUCT_BUNDLE_IDENTIFIER 会把扩展的也改成同一个，签不过。
    WONTON_BUNDLE_ID: app.wonton.ios
packages:
  WontonClient:
    path: WontonClient
  # 截图测试。MIT，只进测试目标，不链接进 App。
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
targets:
  Wonton:
    type: application
    platform: iOS
    sources:
      - Wonton
      - Shared
      # 系统入口（ADR-0100）：快照解码、链接和 OpenIntent 与小组件扩展共用；App 进程里由 SystemEntryModel
      # 订阅核心刷新 WidgetKit 时间线和 Spotlight。
      - SystemEntry
    dependencies:
      - package: WontonClient
      - target: ShareExtension
      - target: WidgetExtension
    # 数据目录在 App Group 的容器里，分享扩展才放得进收件目录（ADR-0097）。
    entitlements:
      path: Wonton/Wonton.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(WONTON_BUNDLE_ID)
    # 版本号靠生成工程时写出的 Version.xcconfig（或 xcodebuild 显式传参）。两源皆空时 Release 会落到
    # 0.0.0 或空，编译前在这里挡下；Debug 允许 0.0.0（CI 浅克隆没有 tag）。
    preBuildScripts:
      - name: 检查发版版本号
        showEnvVars: false
        basedOnDependencyAnalysis: false
        script: |
          case "${CONFIGURATION:-}/$MARKETING_VERSION" in
            Release/"" | Release/"0.0.0")
              echo "error: Release 拿不到版本号：用 WONTON_VERSION=X.Y.Z 重新生成工程，或给 xcodebuild 显式传 MARKETING_VERSION / CURRENT_PROJECT_VERSION" >&2
              exit 1
              ;;
          esac
    # 由 xcodegen 生成，和下面的 INFOPLIST_KEY_* 合并；生成的文件不提交。
    info:
      path: Wonton/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: app.wonton.navigation
            CFBundleURLSchemes:
              - wonton
          # Matrix 登录的回调（核心的 `oidcRedirectUri`）。网页登录面板自己截住回调，用不到它；注册了，回调从面板以外的路径
          # （Safari、`simctl openurl`）回来时也能交给核心核对，而不是被系统说“打不开”。
          - CFBundleURLName: app.wonton.matrix-login
            CFBundleURLSchemes:
              - io.github.wontonapp
        # M0 的网关和插件网页只有 http（HTTPS 方案在 M1 定），只对 WebView 里的内容放开。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          # 文件的播放器经核心在回环地址上的 http 地址取数据（ADR-0020）。
          NSAllowsLocalNetworking: true
        # iroh 经局域网直连家里的服务器时，iOS 要先征得用户同意。
        # 这三句和 App 名字的各语言版本在 InfoPlist.xcstrings，这里是英文的基础值。
        NSLocalNetworkUsageDescription: Wonton connects directly to your home server over the local network.
        NSCameraUsageDescription: Wonton uses the camera to scan the pairing QR code from your home server.
        # 插件网页要麦克风时弹（ADR-0033）；各语言版本在 InfoPlist.xcstrings。
        NSMicrophoneUsageDescription: Wonton uses the microphone for voice input on app pages.
        NSPhotoLibraryAddUsageDescription: Wonton saves photos from your chats to your photo library.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchGlyph
          UIImageRespectsSafeAreaInsets: false
        WontonAppGroup: group.$(WONTON_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WONTON_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        # OpenIntent（ADR-0100）同时编进 App 和小组件扩展，只有 App 进程里的实现能碰导航模型。
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WONTON_APP"
        INFOPLIST_KEY_CFBundleDisplayName: Wonton
        # 文字按含义起名的键写在 String Catalog 里，代码用生成的符号（`Text(.settingsLanguage)`），键写错编译不过；
        # 不让编译器从 `Text("…")` 里自动抽取，免得写死的字面量混进目录。
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"

  # 系统分享面板里的“云吞”（ADR-0097）：只把东西复制进收件目录、打开 App，不链接 Rust 核心。
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(WONTON_BUNDLE_ID)
    info:
      path: ShareExtension/Info.plist
      properties:
        WontonAppGroup: group.$(WONTON_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # 和附件区一样一次最多 10 项（wonton-protocol 的 SHARE_MAX_ITEMS）。
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    # 版本号不在这里设：和 App 一样取工程级的 Version.xcconfig。扩展的 CFBundleShortVersionString、CFBundleVersion
    # 必须和 App 的一致，App Store 校验不过。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WONTON_BUNDLE_ID).share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wonton
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        TARGETED_DEVICE_FAMILY: "1"

  # 系统入口（ADR-0100）：WidgetKit 小组件和控制按钮。不链接 WontonClient，只读 App Group 里的
  # widget/snapshot.json（快照字段名由 wonton-protocol 的契约测试锁住），点了经 wonton:// 链接进 App。
  WidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - WidgetExtension
      - SystemEntry
      - Shared
    entitlements:
      path: WidgetExtension/WidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(WONTON_BUNDLE_ID)
    info:
      path: WidgetExtension/Info.plist
      properties:
        WontonAppGroup: group.$(WONTON_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # 版本号同 App（见 ShareExtension 的注释）：扩展的 CFBundleShortVersionString、CFBundleVersion 必须和 App 的一致。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WONTON_BUNDLE_ID).widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wonton
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        TARGETED_DEVICE_FAMILY: "1"

  WontonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WontonTests
    dependencies:
      - target: Wonton
      - package: WontonClient
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wonton.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  WontonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WontonUITests
    dependencies:
      - target: Wonton
      - package: WontonClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.wonton.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Wonton

schemes:
  Wonton:
    build:
      targets:
        Wonton: all
        WontonUITests: [test]
        WontonTests: [test]
    test:
      targets:
        - WontonTests
        - WontonUITests
      # 截图参考图按英文、美式日期和 UTC 录制；界面的语言、地区和时区都由这里钉住，不受模拟器的系统设置影响。
      # 环境变量要写在 scheme 里：xcodebuild 步骤的 env 传不进模拟器里跑的 App。
      language: en
      region: US
      environmentVariables:
        TZ: UTC
        # 只比较，缺图也报错。
        SNAPSHOT_TESTING_RECORD: never
  # 重录参考图：同样的 App 和测试目标，把录制模式打开；只跑单测，不编 UI 测试。
  WontonSnapshots:
    build:
      targets:
        Wonton: all
        WontonTests: [test]
    test:
      targets:
        - WontonTests
      language: en
      region: US
      environmentVariables:
        TZ: UTC
        SNAPSHOT_TESTING_RECORD: all
