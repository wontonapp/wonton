# gitleaks 配置：默认规则 + 本仓库的误报白名单（2026-11-08 对 main 全部可查历史 218 个提交跑过一遍）。
# 白名单按最小范围写：能按具体值放行的不按路径放行，每条写明为什么。
# 改白名单前先确认那不是真密钥：真密钥不能进白名单，要走作废和改锁流程。

[extend]
useDefault = true

[[allowlists]]
description = "vendor/ 原样同步上游源码（matrix-sdk 等），里面的密钥样例是上游的测试夹具，不是我们的凭据"
paths = ['''^vendor/''']

[[allowlists]]
description = "config 的 JWT 密钥测试夹具只写 PEM 空头，后面紧跟 Rust 代码的 \"）\"；真 PEM 头后面是换行加 base64，不会命中"
condition = "AND"
paths = ['''^crates/wonton-core/src/config(_tests)?\.rs$''']
regexes = ['''-----BEGIN PRIVATE KEY-----"\)''']

[[allowlists]]
description = "配对码打码测试的固定假密钥（session.rs 的测试常量和文档示例）"
condition = "AND"
paths = ['''^crates/wonton-protocol/src/session\.rs$''']
regexes = ['''00112233445566778899aabbccddeeff''']

[[allowlists]]
description = "dev.sh 的 docker run --user 挂 uid:gid，被 curl-auth-user 规则误认成 curl -u 用户:密码"
condition = "AND"
paths = ['''^deploy/dev/core/dev\.sh$''']
regexes = ['''\$\{WONTON_DEV_PUID:-1000\}:\$\{WONTON_DEV_PGID:-1000\}''']

[[allowlists]]
description = "smoke.sh 的状态开关变量（值只有 0 和 1），不是凭据"
condition = "AND"
paths = ['''^deploy/dev/agent/smoke\.sh$''']
regexes = ['''temp_key_issuing=0''']

[[allowlists]]
description = "WebSocket 握手用 RFC 6455 文中的示例 nonce（\"the sample nonce\" 的 base64），不是凭据（分享冒烟与网关能力测试）"
condition = "AND"
paths = ['''^crates/wonton-core/examples/fr_share_smoke/wire\.rs$''', '''^crates/wonton-core/src/gateway/capabilities_tests\.rs$''']
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']

[[allowlists]]
description = "测试里的本地 Hydra 地址带占位用户名密码（user:secret），被 generic-api-key / curl-auth-user 这类规则认成凭据"
condition = "AND"
paths = ['''^crates/wonton-core/src/config_tests\.rs$''']
regexes = ['''user:secret@hydra''']
