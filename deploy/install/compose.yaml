# 正式安装的云吞：核心、身份提供方（Ory Hydra）和 Matrix 服务器（Tuwunel）。系统插件（模型网关 magpie）由核心启动后
# 自己装上（WONTON_SYSTEM_PLUGINS），然后装一次默认 Agent Hermes（WONTON_DEFAULT_PLUGINS）。
#
# 这份文件编进核心的二进制，由 `wonton-core init` 和密钥一起写到安装目录，随核心镜像一起升级；变量来自安装目录的
# .env，由安装脚本写好（deploy/install/install.sh）。
name: wonton

# Docker 客户端配了代理时（~/.docker/config.json），docker compose 会给容器设这些变量。系统服务之间只走内部地址，经代理
# 到不了；busybox wget 还不看 no_proxy，连健康检查访问 127.0.0.1 也发给代理（#121）。写成空，客户端的配置就进不来。
x-no-proxy: &no-proxy
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""

services:
  core:
    # 写成 digest，升级就是换掉 .env 里的这一行再 up（ADR-0012）。
    image: ${WONTON_CORE_IMAGE:?安装目录的 .env 里缺 WONTON_CORE_IMAGE}
    # 核心按这个名字把自己接入每个插件网络。几套核心共用一台 Docker 时（插件开发环境，ADR-0017），各自换一个容器名，
    # 再设实例名 WONTON_INSTANCE；正式安装两个都不设。
    container_name: ${WONTON_CORE_CONTAINER:-wonton-core}
    restart: unless-stopped
    # 核心接在所有插件网络上，不能替别的插件转发：带 NET_RAW 的插件可以把源地址写成核心在 B 网络里的地址、发给核心，
    # 由核心转进 B 的网络，冒充核心（ADR-0023 的“只信任核心的地址”）。
    sysctls:
      - net.ipv4.ip_forward=0
    # 主人的代理在宿主的回环地址上时，经这个名字连。
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      <<: *no-proxy
      WONTON_DATA_DIR: ${WONTON_DATA_DIR:?}
      # 一键升级看的渠道和安装目录（ADR-0025）。
      WONTON_CORE_SOURCE: ${WONTON_CORE_SOURCE:-}
      WONTON_INSTALL_DIR: ${WONTON_INSTALL_DIR:?}
      WONTON_BASE_DOMAIN: ${WONTON_BASE_DOMAIN:?}
      # 没写用户名时核心用记下的，第一次启动时是 owner（ADR-0022），所以这里不写默认值。
      WONTON_OWNER_NAME: ${WONTON_OWNER_NAME:-}
      WONTON_PUBLIC_PORT: ${WONTON_PORT:?}
      WONTON_TUNNEL_PORT: ${WONTON_TUNNEL_PORT:?}
      # 中继表（ADR-0048）：不设时用 n0 的公共中继。
      WONTON_RELAYS: ${WONTON_RELAYS:-}
      WONTON_CORE_CONTAINER: ${WONTON_CORE_CONTAINER:-wonton-core}
      WONTON_INSTANCE: ${WONTON_INSTANCE:-}
      # 宿主的 /dev 挂在这里（下面的 volumes）：核心据此检测显卡设备和它们所属的组（ADR-0018）。
      WONTON_HOST_DEV: /host/dev
      # 出网代理（ADR-0023）：前者是主人指定的，后者是安装脚本检测到的，只作初值。核心自己访问外网也用它们。
      WONTON_EGRESS_PROXY: ${WONTON_EGRESS_PROXY:-}
      WONTON_EGRESS_PROXY_DETECTED: ${WONTON_EGRESS_PROXY_DETECTED:-}
      # 空时核心自动选插件的局域网端口开在哪个地址上（ADR-0019）。
      WONTON_LAN_ADDRESSES: ${WONTON_LAN_ADDRESSES:-}
      WONTON_PLUGIN_SLICE: ${WONTON_PLUGIN_SLICE:-}
      WONTON_PLUGIN_NETWORK_POOL: ${WONTON_PLUGIN_NETWORK_POOL:-10.213.0.0/16}
      # 核心在联邦网络上的固定地址（ADR-0050）：fed/hosts 的名单都指向它。和下面 networks.federation
      # 的 ipv4_address、子网是一对，同机装多套时各给一段（install.sh 写进 .env）。
      WONTON_FEDERATION_CORE_ADDR: ${WONTON_FEDERATION_CORE_ADDR:-10.212.0.10}
      WONTON_SYSTEM_PLUGINS: /usr/share/wonton/system-plugins
      WONTON_DEFAULT_PLUGINS: /usr/share/wonton/default-plugins
      # 系统服务都用带点的别名：核心也接在每个插件网络上，插件的服务名会成为那里的别名。服务名不能带点，这些名字抢不走；
      # 裸的 `hydra`、`tusd` 就可能解析到插件的容器。
      WONTON_OIDC_ADMIN_URL: http://hydra.wonton.internal:4445
      WONTON_OIDC_PUBLIC_URL: http://hydra.wonton.internal:4444
      WONTON_MATRIX_URL: http://tuwunel.wonton.internal:8008
      WONTON_TUSD_URL: http://tusd.wonton.internal:8080
      WONTON_MATRIX_JWT_KEY_FILE: ${WONTON_INSTALL_DIR:?}/secrets/matrix-jwt.pem
      WONTON_MATRIX_REGISTRATION_SECRET_FILE: ${WONTON_INSTALL_DIR:?}/secrets/matrix-registration-secret
      # 第一次安装时由 init 定下，之后不变（ADR-0009 的“Matrix 的服务器名”）。
      WONTON_MATRIX_SERVER_NAME_FILE: ${WONTON_INSTALL_DIR:?}/secrets/matrix-server-name
      WONTON_PUID: ${WONTON_PUID:-1000}
      WONTON_PGID: ${WONTON_PGID:-1000}
      TZ: ${TZ:-UTC}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # 局域网状态页和网关。
      - "${WONTON_PORT}:${WONTON_PORT}"
      # 隧道入口（iroh，UDP）：手机在局域网里直连，在外面打洞或经中继。
      - "${WONTON_TUNNEL_PORT}:${WONTON_TUNNEL_PORT}/udp"
    volumes:
      # 系统服务里只有核心挂载 Docker socket（ADR-0011）。
      - /var/run/docker.sock:/var/run/docker.sock
      # 容器内外路径相同：插件的绑定挂载由宿主上的 Docker 解析。
      - ${WONTON_DATA_DIR}:${WONTON_DATA_DIR}
      - ${WONTON_INSTALL_DIR}/secrets:${WONTON_INSTALL_DIR}/secrets:ro
      # 联邦名单和 hosts（ADR-0050）：核心原地重写（不能换 inode，单文件绑定挂载钉住 inode），
      # Tuwunel 只读挂载里面的两个文件。
      - ${WONTON_INSTALL_DIR}/fed:${WONTON_INSTALL_DIR}/fed
      # 只读看宿主的设备节点（有没有显卡、属于哪个组）；设备 cgroup 没放行，核心开不了它们。不递归：/dev 下的子挂载
      # （/dev/shm 里是宿主其他进程的共享内存，还有 /dev/pts、/dev/mqueue）不带进来，核心只要 devtmpfs 里的节点。
      - type: bind
        source: /dev
        target: /host/dev
        read_only: true
        bind:
          recursive: disabled
    networks:
      core:
        # tusd 经这个别名调文件钩子。
        aliases: [files-hooks.wonton.internal]
      federation:
        # 核心在联邦网络上的固定地址：fed/hosts 的名单都指向它（ADR-0050）。和上面传给核心的
        # WONTON_FEDERATION_CORE_ADDR、文件末尾 federation 网络的 subnet 是同一个值，一起改；
        # 地址变了会黏住 Tuwunel 的目的地缓存和 hosts 快照，装好后不能变。
        ipv4_address: ${WONTON_FEDERATION_CORE_ADDR:-10.212.0.10}
    depends_on:
      hydra:
        condition: service_healthy
      tuwunel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wonton-core", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 2m
      start_interval: 1s

  # 设备上传的字节（ADR-0020）。只在核心的私有网络里，经核心网关鉴权后才到它；没传完的数据放在核心数据目录下。
  tusd:
    image: tusproject/tusd:v2.10.1@sha256:7b1c552a8b42f4b36cb01f2a3bd49f82ab078b2eefd191459e716141dd50376c
    restart: unless-stopped
    user: "${WONTON_PUID:-1000}:${WONTON_PGID:-1000}"
    # 只写 /srv/uploads，什么特权都不要。
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment: *no-proxy
    command:
      - -upload-dir=/srv/uploads
      - -base-path=/_wonton/files/uploads/
      - -behind-proxy
      - -disable-cors
      - -disable-download
      - -disable-concatenation
      - -hooks-http=http://files-hooks.wonton.internal:${WONTON_PORT}/
      - -hooks-enabled-events=pre-create,post-finish
      - -hooks-http-retry=2
      - -hooks-http-backoff=1s
    volumes:
      # 第一次启动时 Docker 建这个目录，属主是 root；tusd 要等核心健康才启动，那时核心已经把它交给 PUID:PGID。
      - ${WONTON_DATA_DIR}/core/files/uploads:/srv/uploads
    networks:
      core:
        aliases: [tusd.wonton.internal]
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/metrics"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  hydra-migrate:
    image: oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    command: migrate sql up -e --yes
    environment:
      <<: *no-proxy
      DSN: sqlite:///home/nonroot/hydra.sqlite?_fk=true
    volumes:
      # 镜像以 nonroot 运行，卷挂在它的家目录才有写权限。
      - hydra:/home/nonroot
    networks: [core]

  hydra:
    image: oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    # --dev 允许 http 签发方：网关和隧道里只跑 http（ADR-0009）。
    command: serve all --dev
    restart: unless-stopped
    # SECRETS_SYSTEM，由 `wonton-core init` 生成。
    env_file: secrets/hydra.env
    environment:
      <<: *no-proxy
      DSN: sqlite:///home/nonroot/hydra.sqlite?_fk=true
      # 浏览器和插件看到的签发方地址，经核心网关的 auth.<base> 转发到这里。
      URLS_SELF_ISSUER: http://auth.${WONTON_BASE_DOMAIN}:${WONTON_PORT}
      # 登录和授权确认交给核心：核心按自己的会话直接接受，用户不会看到第二个登录页。
      URLS_LOGIN: http://${WONTON_BASE_DOMAIN}:${WONTON_PORT}/_wonton/oidc/login
      URLS_CONSENT: http://${WONTON_BASE_DOMAIN}:${WONTON_PORT}/_wonton/oidc/consent
      URLS_POST_LOGOUT_REDIRECT: http://${WONTON_BASE_DOMAIN}:${WONTON_PORT}/
    volumes:
      - hydra:/home/nonroot
    # 只在核心的私有网络里：插件访问不到管理端口（4445），公开端口也只经核心网关访问。
    networks:
      core:
        aliases: [hydra.wonton.internal]
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4445/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 1m
      start_interval: 1s

  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel:v1.9.4@sha256:0e86c6164d6c9f5b60291938eb61ad8395021c37fe58d47a963ea7edddbedaec
    restart: unless-stopped
    # 升级后首次启动可能在迁移数据库，不能被 10 秒后强杀（见 Tuwunel 的 docker.md）。
    stop_grace_period: 5m
    # 两份配置（ADR-0050）：第一份是安装时的主体配置，第二份只有联邦名单，由核心重写并热加载。
    command: ["-c", "/etc/tuwunel/tuwunel.toml", "-c", "/etc/tuwunel/fed.toml"]
    environment:
      <<: *no-proxy
      # 配置和 JWT 公钥都在文件里：轮换签发密钥时核心改写它、发 SIGUSR1 热加载（ADR-0009）。
      TUWUNEL_CONFIG: /etc/tuwunel/tuwunel.toml
    volumes:
      - tuwunel:/var/lib/tuwunel
      - ${WONTON_INSTALL_DIR}/secrets/tuwunel.toml:/etc/tuwunel/tuwunel.toml:ro
      - ${WONTON_INSTALL_DIR}/fed/config.toml:/etc/tuwunel/fed.toml:ro
      # 联邦的出站解析不走 DNS：配对过的服务器名写在这里，指向核心的固定地址（ADR-0050）。
      - ${WONTON_INSTALL_DIR}/fed/hosts:/etc/hosts:ro
    # 只在核心的私有网络里，App 和 Bot 都经核心网关访问它（ADR-0009）；8448 不映射到主机，联邦只经隧道进来。
    networks:
      core:
        aliases: [tuwunel.wonton.internal]
      federation:
    healthcheck:
      test: ["CMD", "tuwunel", "--health-check"]
      interval: 10s
      timeout: 5s
      start_period: 5m
      start_interval: 1s

networks:
  core:
  # 联邦专用的内部网络（ADR-0050）：只有核心和 Tuwunel，8448 不出这台机器。子网固定是为了核心的
  # ipv4_address 固定；同机装多套时用 WONTON_FEDERATION_SUBNET 各给一段，撞上宿主已有的网络时
  # compose 起不来，报错明确，换个网段重跑安装命令即可。
  federation:
    ipam:
      config:
        - subnet: ${WONTON_FEDERATION_SUBNET:-10.212.0.0/24}

volumes:
  hydra:
  tuwunel:
