services:
  web:
    image: curlimages/curl:8.23.0
    entrypoint: ["sh", "-c"]
    command: ["sleep 3600"]
    environment:
      TOKEN: ${WONTON_SECRET_TOKEN}
    healthcheck:
      test: ["CMD", "sh", "-c", "test -n \"$$TOKEN\""]
  side:
    image: curlimages/curl:8.23.0
    entrypoint: ["sh", "-c"]
    command: ["sleep 3600"]
x-wonton:
  spec: "0.8"
  id: app.plat732.input
  version: 1.0.0
  kind: app
  title: { zh: 输入密钥测试, en: Input secret test }
  description: { zh: 测 plat-732, en: plat-732 smoke }
  permissions: []
  secrets:
    token:
      input:
        title: { zh: 令牌, en: Token }
        required: true
