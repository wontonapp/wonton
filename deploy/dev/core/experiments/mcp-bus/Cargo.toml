# MCP 总线选型实验（ADR-0006“验证结果”）：用官方 Rust SDK rmcp 做最小聚合。
# 独立的 Cargo 工作区，不进入主工作区和 CI；复跑方法见 README.md。
[package]
name = "mcp-bus-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
http = "1"
rmcp = { version = "3.8.0", features = ["server", "client", "macros", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal"] }
