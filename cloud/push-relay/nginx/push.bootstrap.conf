# 首次签证书前的临时 vhost：只开 80，交给 certbot 走 http-01。
# 签完之后 install.sh 会用 push.808cbd.com.conf 覆盖。
server {
    listen 80;
    listen [::]:80;
    server_name push.808cbd.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
