# 推送中继的入口。只反代到回环上的包装器，鉴权和限速都在包装器里。
# 主人两个站的 server 块不受影响：这里 server_name 只写这一个子域，精确匹配优先于 808cbd 的通配。
server {
    listen 80;
    listen [::]:80;
    server_name push.808cbd.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name push.808cbd.com;

    ssl_certificate /etc/letsencrypt/live/push.808cbd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.808cbd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Web Push 一条最多 4 KiB；包装器自己再挡 2816 字节，这里只兜一层。
    client_max_body_size 8k;
    access_log /var/log/nginx/push.808cbd.com.access.log;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }
}
