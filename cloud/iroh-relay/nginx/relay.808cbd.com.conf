# 中继入口：nginx 终结 TLS，按 WebSocket Upgrade 反代到回环上的 iroh-relay。
# 中继自己是 HTTP（--dev）；UDP 7842 的 QAD 不经过 nginx，由阿里云安全组直接放行。
# server_name 只写这一个子域，精确匹配优先于 808cbd.com 的通配符块。
server {
    listen 80;
    listen [::]:80;
    server_name relay.808cbd.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.808cbd.com;

    ssl_certificate /etc/letsencrypt/live/relay.808cbd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.808cbd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:relay_ssl:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/relay.808cbd.com.access.log;

    # iroh 的 relay 协议是一个到 /relay 的 WebSocket upgrade；握手是普通 RFC 6455。
    location / {
        proxy_pass http://127.0.0.1:8742;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 中继连接是长连接，空闲很久也不能断；nginx 默认 60s 会切。
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
