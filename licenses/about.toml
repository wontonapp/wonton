# cargo-about 的配置：许可清单必须全部落在这里的项里，否则生成失败。
# 顺序即优先顺序：双许可的 crate 取靠前的那个，清单里只出现它。
# 只收宽松许可和文件级的 MPL。GPL、AGPL 故意不在这里：新依赖带进来就报错，由人决定要不要。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "BSD-1-Clause",
    "MPL-2.0",
    # 只在 Android 侧用到（JNA），Rust 侧目前没有；和 APPROVED 保持同一张表。
    "LGPL-2.1-or-later",
    # Android SDK 的条款（play-services、firebase 基础库随包带进来），同上。
    # cargo-about 0.9.3 的 SPDX 表没有 ASDKL，写成 LicenseRef-；generate-licenses.py 比声明时会去掉前缀，
    # 和 APPROVED、licenses/texts/ASDKL.txt 的 id 保持一致。
    "LicenseRef-ASDKL",
]

# 只列的 .so 里真正链进去的：build script、测试用的 crate 不进清单。
ignore-build-dependencies = true
ignore-dev-dependencies = true

# 工作区自己的 crate 不列：App 是它们的发布方，不是第三方。
private = { ignore = true }
