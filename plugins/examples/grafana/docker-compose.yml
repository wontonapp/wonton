# 示例插件：Grafana。核心安装时注入 OIDC 配置，主人打开网页即自动登录。
# 规范见 docs/plugin-spec.md；变量只用于插值，需要进容器的显式写进 environment。
name: grafana
services:
  grafana:
    image: grafana/grafana:12.2.1
    user: "${PUID}:${PGID}"
    environment:
      GF_SERVER_ROOT_URL: ${WONTON_APP_URL}/
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # 只保留 OIDC 登录，打开即跳转到核心的身份提供方
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Wonton
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${WONTON_OIDC_AUTH_URL}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${WONTON_OIDC_TOKEN_URL}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${WONTON_OIDC_USERINFO_URL}
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'owner') && 'Admin' || 'Viewer'"
    volumes:
      - ${WONTON_APP_DATA}/data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

x-wonton:
  spec: "0.4"
  id: app.grafana
  version: 0.1.0
  kind: app
  title: { zh: 仪表盘, en: Dashboards }
  description:
    zh: Grafana 示例插件，打开即以 Wonton 身份自动登录
    en: Grafana example plugin that signs you in with your Wonton identity
  icon: icon.png
  notices: [LICENSE.icon]
  tags: { zh: [监控], en: [Monitoring] }
  webui:
    service: grafana
    port: 3000
    sso: oidc
    oidc:
      redirect_paths: [/login/generic_oauth]
  permissions: []
  requirements:
    arch: [amd64, arm64]
    memory: 256M
